      hand:  { label: "Hand", icon: "👋", color: "#fbbf24", desc: "Drag to pan the map canvas. On mobile, swipe to scroll.", iconColor: null },
      space: { label: "Space", icon: "🛸", color: "#60a5fa", desc: "Places an invisible space tile, making the cell fully transparent in the exported map.", iconColor: null },
      eyedropper: { label: "Pick (Eyedropper)", icon: "🧪", color: "#39ff14", desc: "Click a cell on the map to pick up its tile as the active selection. The tile becomes your current painting tile.", iconColor: null },
      single: { label: "Single", icon: "S", color: C.accent, desc: "Freehand paint mode. Click or drag to place tiles one cell at a time.", iconColor: C.accent },
      line:   { label: "Line", icon: "L", color: C.accent, desc: "Line draw mode. Click a start cell and drag to an end cell — tiles are placed in a straight line between them.", iconColor: C.accent },
      rect:   { label: "Rectangle", icon: "R", color: C.accent, desc: "Rectangle fill mode. Click and drag to define a bounding box — all cells inside are filled with the selected tile.", iconColor: C.accent },
      fill:   { label: "Fill", icon: "F", color: C.accent, desc: "Flood fill mode. Click a cell to select all connected cells sharing the same filled/empty state (BFS). Commit fills them all at once.", iconColor: C.accent },
      mirrorV: { label: "Horizontal Mirror", icon: "H", color: C.pale, desc: "Mirrors every paint action horizontally (left ↔ right). The mirror axis runs vertically through the grid centre.", iconColor: C.pale },
      mirrorH: { label: "Vertical Mirror", icon: "V", color: C.soft, desc: "Mirrors every paint action vertically (top ↔ bottom). The mirror axis runs horizontally through the grid centre.", iconColor: C.soft },
      mirrorD: { label: "Diagonal Mirror", icon: "D", color: C.accentBright, desc: "Mirrors every paint action diagonally (point-reflected through the grid centre). Can be combined with Horizontal and Vertical mirrors.", iconColor: C.accentBright },
      guides: { label: "Guides", icon: "🧭", color: gColor, desc: "Shows dashed mirror axis lines on the canvas — a vertical line and a horizontal line through the grid centre. Useful for aligning tiles when mirroring is active.", iconColor: null },
      offsetCenters: { label: "Offset Centers", icon: "🎯", color: ocColor, desc: "Overlays a white outlined rectangle on every tile that has a non-zero offset applied. Useful for checking placement alignment.", iconColor: null },
      replace: { label: "Replace", icon: "♻️", color: C.soft, desc: "Two-step tile replacement: first pick a tile on the map, then pick its replacement. All instances of the original tile are swapped at once.", iconColor: null },
      overwrite: { label: "Block Overwrite", icon: "🧱", color: owColor, desc: "When enabled, painting over an occupied cell replaces it with the currently selected tile instead of picking it up for dragging.", iconColor: null },
      otg: { label: "OTG Detection", icon: "🧩", color: C.danger, desc: "Detects One Tile Gap cells — cells that create unreachable single-tile passages. Red overlay highlights them. Map edges count as walls.", iconColor: null },
      highlight: { label: "Highlight", icon: "🪄", color: "#a78bfa", desc: "Select an area to highlight and move it as a group. Draw with any selection mode to highlight cells, then drag the highlighted region to move it.", iconColor: "#a78bfa" },
      selectionMode: { label: "Selection Mode", icon: "🖌️", color: C.accent, desc: "Controls how tiles are placed on the grid. Single: freehand paint. Line: draw a straight line between two points. Rectangle: fill a rectangular area. Fill: flood-fill all connected empty cells.", iconColor: null },
      mirroring: { label: "Mirroring", icon: "🪞", color: C.pale, desc: "Mirrors every paint action across one or more axes. Horizontal mirrors left↔right. Vertical mirrors top↔bottom. Diagonal applies a 180° point reflection. All three can be combined.", iconColor: null },
      convert: { label: "Convert", icon: "🔄", color: C.soft, desc: "Remaps tiles on the board from one tileset to another by matching tile names. Tiles with no equivalent in the target tileset are left as-is.", iconColor: null },
      magnet: { label: "Magnet", icon: "🧲", color: "#2563eb", desc: "Sets a custom mirror origin for the map. All mirroring axes (H, V, D) pivot around this point instead of the true map centre. Click any cell on the canvas to place the origin. Use the size dropdown on the card to choose a 1×1 or 2×2 centre zone. Useful for asymmetric or experimental Showdown layouts.", iconColor: null },
      hotkeys: { label: "Hotkeys", icon: "⌨️", color: C.text, desc: "Keyboard shortcuts: E = Erase, W = Eyedropper, R = Rotate selected tile, Z = Undo, X = Redo, Ctrl+Z = Undo, Ctrl+Y = Redo, Escape = Clear highlight.", iconColor: null },
      warn: { label: "Warn", icon: "⚠️", color: "#f97316", desc: "Places an invisible warning marker tile. Warning markers appear as semi-transparent ⚠️ overlays on the canvas but are not exported as tiles — useful for marking hazardous or incomplete areas.", iconColor: null },
      duplicate: { label: "Duplicate", icon: "💞", color: "#e879a0", desc: "Copies the highlighted region to a new position without moving the originals. Drag the highlighted area to preview the copy placement, then press Apply. Mirror-aware: if any mirror axis is active, the copy is extended to also cover mirror positions.", iconColor: "#e879a0" },
    };
    const def = toolDefs[infoTool];
    if (!def) return null;
    // Space / Warn are starred by their tile ref ("space" / "warn"); other tools by their tool key
    const toolId = infoTool === "space" ? SPACE_REF : infoTool === "warn" ? WARN_REF : infoTool;
    const isStarredTool = starredTiles.includes(toolId);
    // These tools have no functional starred shortcut; hide the star checkbox
    const NON_STARREABLE = new Set(["hotkeys", "selectionMode", "mirroring"]);
    return (
      <div className="modal-backdrop" onClick={() => setInfoTool(null)}>
        <div className="modal-box" onClick={e => e.stopPropagation()}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
            <span style={{ fontSize: 13, fontWeight: 700, color: C.accentBright }}>{def.label}</span>
            <button onClick={() => setInfoTool(null)} style={{ background: "none", border: "none", cursor: "pointer", color: C.muted, fontSize: 18, lineHeight: 1 }}>×</button>
          </div>
          <div style={{ background: C.panelDeep, borderRadius: 8, padding: 20, display: "flex", alignItems: "center", justifyContent: "center", minHeight: 80 }}>
            <span style={{ fontSize: 36, color: def.iconColor ?? undefined }}>{def.icon}</span>
          </div>
          <p style={{ fontSize: 12, color: C.muted, lineHeight: 1.6 }}>{def.desc}</p>
          {!NON_STARREABLE.has(infoTool) && (
          <label style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer", userSelect: "none" }}>
            <input type="checkbox" checked={isStarredTool}
              onChange={() => toggleStar(toolId)}
              style={{ width: 14, height: 14, accentColor: C.accent, cursor: "pointer" }} />
            <span style={{ fontSize: 11, color: C.text }}>Starred shortcut ⭐</span>
          </label>
          )}
          {infoTool === "otg" && (
            <button style={{ ...btn(false, C.soft, C.softDim), fontSize: 11 }}
              onClick={() => { setOtgOpen(true); setInfoTool(null); }}>
              ⚙ OTG Settings
            </button>
          )}
        </div>
      </div>
    );
  };

  // ── Memory usage modal ───────────────────────────────────────────
  const MemoryModal = () => {
    if (!memoryOpen) return null;
    const entries = [];
    let total = 0;
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (!key || !key.startsWith('oph_')) continue;
      const val = localStorage.getItem(key) || "";
      const bytes = val.length * 2;
      total += bytes;
      entries.push({ key, bytes });
    }
    entries.sort((a, b) => b.bytes - a.bytes);
    const fmt = b => b < 1024 ? `${b} B` : `${(b/1024).toFixed(1)} KB`;
    return (
      <div className="modal-backdrop" onClick={() => setMemoryOpen(false)}>
        <div className="modal-box" style={{ maxWidth: 400 }} onClick={e => e.stopPropagation()}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span style={{ fontSize: 13, fontWeight: 700, color: C.accentBright }}>Storage Usage</span>
            <button onClick={() => setMemoryOpen(false)} style={{ background: "none", border: "none", cursor: "pointer", color: C.muted, fontSize: 18 }}>×</button>
          </div>
          <div style={{ overflowY: "auto", maxHeight: 320, display: "flex", flexDirection: "column", gap: 2 }}>
            {entries.map(({ key, bytes }) => (
              <div key={key} style={{ display: "flex", justifyContent: "space-between", fontSize: 11, padding: "2px 0", borderBottom: `1px solid ${C.border}` }}>
                <span style={{ color: C.muted, fontFamily: "monospace", fontSize: 10 }}>{key}</span>
                <span style={{ color: C.text, fontWeight: 600 }}>{fmt(bytes)}</span>
              </div>
            ))}
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span style={{ fontSize: 12, color: C.text }}>Total: <strong>{fmt(total)}</strong></span>
            <button style={{ ...btn(true, C.danger, "rgba(248,113,113,0.14)") }}
              onClick={() => { if (confirm("Clear all stored data and reset the app to factory defaults?")) { localStorage.clear(); window.location.reload(); } }}>
              Clear All Data
            </button>
          </div>
          <button style={btn(false)} onClick={() => setMemoryOpen(false)}>Close</button>
        </div>
      </div>
    );
  };

  // ── Convert modal — remap tileset tiles on the board ────────────
  const ConvertModal = () => {
    if (!convertOpen) return null;
    const byAlpha = (a, b) => a.name.localeCompare(b.name);
    const sortedTilesets = [...dbTilesets].sort(byAlpha);
    const allAvailableNames = sortedTilesets.map(ts => ts.name);

    const defaultFrom = activeTileset ?? allAvailableNames[0] ?? "";
    const defaultTo   = allAvailableNames.find(n => n !== defaultFrom) ?? "";
    const [fromTs, setFromTs] = React.useState(defaultFrom);
    const [toTs,   setToTs]   = React.useState(defaultTo);

    // Codename-based remap: match tiles across tilesets strictly by codename.
    const fromTsDef = dbTilesets.find(ts => ts.name === fromTs);
    const toTsDef   = dbTilesets.find(ts => ts.name === toTs);
    const toDbTiles = toTsDef ? (dbTilesByTsId[toTsDef.id] ?? null) : null;

    // Auto-load "to" tileset tiles when modal opens or target tileset changes
    React.useEffect(() => {
      if (toTsDef && toDbTiles === null) ensureTilesetLoaded(toTsDef.id);
    }, [toTs]); // eslint-disable-line react-hooks/exhaustive-deps

    // flatDefaultTiles only holds the active tileset, so read both sides from the per-tileset fetch cache.
    const fromObjs = fromTsDef ? sortedRows(dbTilesByTsId[fromTsDef.id]).map(r => buildDbTile(r, fromTsDef)) : [];
    const toObjs   = toTsDef   ? sortedRows(dbTilesByTsId[toTsDef.id]).map(r => buildDbTile(r, toTsDef))   : [];
    const toCodenameToRef = {};
    toObjs.forEach(t => { if (t.codename) toCodenameToRef[t.codename] = t.ref; });

    const refRemap = {};
    const fromAll = new Set();
    fromObjs.forEach(t => {
      fromAll.add(t.ref);
      if (t.codename && toCodenameToRef[t.codename] !== undefined) refRemap[t.ref] = toCodenameToRef[t.codename];
    });

    // Only the active tileset's tiles can be on the board, so count nothing for any other "From".
    const fromIsActive = fromTs === activeTileset;
    const boardFromRefs = new Set();
    if (fromIsActive) grid.forEach(row => row.forEach(idx => { const ref = idx == null ? null : refAt(palette, idx); if (ref && fromAll.has(ref)) boardFromRefs.add(ref); }));
    const unmapped = [...boardFromRefs].filter(ref => refRemap[ref] === undefined);
    const mappable = [...boardFromRefs].filter(ref => refRemap[ref] !== undefined);
    const toTilesNotLoaded = toTsDef && toDbTiles === null;

    // Converting is a tileset switch (one tileset per map): delegate so remap, compat flow and clearing stay in one place.
    const doConvert = () => {
      setConvertOpen(false);
      switchTileset(toTs);
    };

    const TsSelect = ({ value, onChange }) => (
      <select value={value} onChange={e => onChange(e.target.value)}
        style={{ background: C.panel, color: C.text, border: `1px solid ${C.border}`, borderRadius: 5, fontSize: 11, padding: "3px 6px", cursor: "pointer", outline: "none" }}>
        {sortedTilesets.map(ts => <option key={ts.name} value={ts.name}>{ts.profiles?.username ? `${ts.name} by ${ts.profiles.username}` : ts.name}</option>)}
      </select>
    );

    return (
      <div className="modal-backdrop" onClick={() => setConvertOpen(false)}>
        <div className="modal-box" style={{ maxWidth: 360 }} onClick={e => e.stopPropagation()}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span style={{ fontSize: 13, fontWeight: 700, color: C.accentBright }}>Convert Tileset Tiles</span>
            <button onClick={() => setConvertOpen(false)} style={{ background: "none", border: "none", cursor: "pointer", color: C.muted, fontSize: 18 }}>×</button>
          </div>
          <p style={{ fontSize: 11, color: C.muted, lineHeight: 1.6 }}>Switches the board to another tileset, matching tiles by name. A map holds one tileset at a time.</p>
          <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
            <div style={{ display: "flex", flexDirection: "column", gap: 3, flex: 1 }}>
              <span style={{ fontSize: 10, color: C.muted }}>From</span>
              <TsSelect value={fromTs} onChange={v => {
                setFromTs(v);
                if (v === toTs) {
                  const alt = allAvailableNames.find(n => n !== v);
                  if (alt) setToTs(alt);
                }
              }} />
            </div>
            <span style={{ color: C.muted, fontSize: 18, marginTop: 14 }}>→</span>
            <div style={{ display: "flex", flexDirection: "column", gap: 3, flex: 1 }}>
              <span style={{ fontSize: 10, color: C.muted }}>To</span>
              <TsSelect value={toTs} onChange={v => {
                setToTs(v);
                if (v === fromTs) {
                  const alt = allAvailableNames.find(n => n !== v);
                  if (alt) setFromTs(alt);
                }
              }} />
            </div>
          </div>
          {fromTs && toTs && fromTs !== toTs && (
            <div style={{ fontSize: 11, color: C.text, background: C.panelAlt ?? "rgba(0,0,0,0.2)", borderRadius: 6, padding: "6px 10px" }}>
              {toTilesNotLoaded
                ? <div style={{ color: "#fbbf24" }}>Loading target tileset tiles…</div>
                : <>
                    <div>{mappable.length} tile type{mappable.length !== 1 ? "s" : ""} will be converted.</div>
                    {unmapped.length > 0 && <div style={{ color: "#fbbf24" }}>{unmapped.length} type{unmapped.length !== 1 ? "s" : ""} have no codename match in {toTs}; you will be asked what to replace them with.</div>}
                    {!fromIsActive && <div style={{ color: "#fbbf24" }}>The board only holds {activeTileset} tiles — pick it as "From".</div>}
                  </>
              }
            </div>
          )}
          <div style={{ display: "flex", gap: 8 }}>
            <button style={{ ...btn(true, C.accent, C.accentDim), flex: 1 }}
              disabled={!fromTs || !toTs || fromTs === toTs || toTilesNotLoaded || !fromIsActive}
              onClick={doConvert}>
              Convert
            </button>
            <button style={btn(false)} onClick={() => setConvertOpen(false)}>Cancel</button>
          </div>
        </div>
      </div>
    );
  };

  // ── Hotkeys modal ─────────────────────────────────────────────
  const HotkeysModal = () => {
    if (!hotkeysOpen) return null;
    const keys = [
      ["E", "Erase tool"],
      ["W", "Pick (eyedropper) tool"],
      ["R", "Rotate selected tile"],
      ["C", "Open Convert modal"],
      ["Z / Ctrl+Z", "Undo"],
      ["X / Ctrl+Y", "Redo"],
      ["Escape", "Clear highlight"],
      ["+/-", "Zoom in/out"],
    ];
    return (
      <div className="modal-backdrop" onClick={() => setHotkeysOpen(false)}>
        <div className="modal-box" style={{ maxWidth: 320 }} onClick={e => e.stopPropagation()}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span style={{ fontSize: 13, fontWeight: 700, color: C.accentBright }}>Hotkeys</span>
            <button onClick={() => setHotkeysOpen(false)} style={{ background: "none", border: "none", cursor: "pointer", color: C.muted, fontSize: 18 }}>×</button>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
            {keys.map(([key, desc]) => (
              <div key={key} style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <kbd style={{ background: "rgba(0,0,0,0.35)", border: `1px solid ${C.border}`, borderRadius: 4, padding: "2px 7px", fontSize: 11, fontFamily: "monospace", color: C.accentBright, minWidth: 80, textAlign: "center", flexShrink: 0 }}>{key}</kbd>
                <span style={{ fontSize: 11, color: C.text }}>{desc}</span>
              </div>
            ))}
          </div>
          <button style={btn(false)} onClick={() => setHotkeysOpen(false)}>Close</button>
        </div>
      </div>
    );
  };

  // ── Tileset Compatibility Modal ─────────────────────────────────────
  const TilesetCompatModal = () => {
    const [openPickerFor, setOpenPickerFor] = React.useState(null);
    if (!tilesetSwitchPending) return null;
    const { newTilesetName, newTsDef, newTilesCached, tsBg, mismatches, remaps } = tilesetSwitchPending;

    // If the incoming tileset's tiles haven't landed in React state yet, show a loading
    // indicator. switchTileset already called setDbTilesByTsId, so they will arrive on
    // the next render. If somehow they never arrive (e.g. a stale close-over), trigger
    // the fetch once via effect.
    const tilesReady = newTsDef ? dbTilesByTsId[newTsDef.id] !== undefined : true;
    React.useEffect(() => {
      if (tilesReady || !newTsDef || !isAuthenticated) return;
      let cancelled = false;
      (async () => {
        const token = currentUser?.firebaseToken ? await getValidToken() : null;
        const tilesUrl = new URL(`${WORKER_URL}/rest/v1/tiles`);
        tilesUrl.searchParams.set('tileset_id', `eq.${newTsDef.id}`);
        tilesUrl.searchParams.set('order', 'sort_index');
        const hdrs = token
          ? { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
          : { 'Content-Type': 'application/json' };
        try {
          const resp = await workerFetch(tilesUrl.toString(), { headers: hdrs });
          const rows = resp.ok ? await resp.json() : [];
          const data = Array.isArray(rows) ? rows : [];
          if (!cancelled) {
            setDbTilesByTsId(prev => ({ ...prev, [newTsDef.id]: data }));
            dbTilesByTsIdRef.current = { ...dbTilesByTsIdRef.current, [newTsDef.id]: data };
          }
        } catch {}
      })();
      return () => { cancelled = true; };
    }, [tilesReady, newTsDef?.id]);

    if (!tilesReady) {
      return (
        <div className="modal-backdrop">
          <div className="modal-box" style={{ maxWidth: 480, alignItems: 'center' }} onClick={e => e.stopPropagation()}>
            <span style={{ fontSize: 12, color: C.muted }}>Loading tileset tiles…</span>
          </div>
        </div>
      );
    }

    // flatDefaultTiles only holds the outgoing tileset + globals; the incoming tileset comes from the fetch cache.
    const newTilesForDropdown = newTsDef ? sortedRows(dbTilesByTsId[newTsDef.id]).map(r => buildDbTile(r, newTsDef)) : [];
    const globalTilesForDropdown = flatDefaultTiles.filter(t => !t.isDb);

    const handleConfirm = () => {
      const pending = tilesetSwitchPending;
      if (!pending) return;
      const resolvedBg = pending.tsBg ?? { bg1: "#1a2332", bg2: "#1e2838" };
      finishSwitch(pending.newTilesetName, pending.newTsDef, pending.oldTsDef, pending.remaps, resolvedBg);
      setTilesetSwitchPending(null);
    };

    return (
      <div className="modal-backdrop" onClick={() => setTilesetSwitchPending(null)}>
        <div className="modal-box" style={{ maxWidth: 480, maxHeight: '80vh', display: 'flex', flexDirection: 'column' }} onClick={e => e.stopPropagation()}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
            <span style={{ fontSize: 13, fontWeight: 700, color: C.accentBright }}>Tileset Compatibility</span>
            <button onClick={() => setTilesetSwitchPending(null)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: C.muted, fontSize: 18 }}>×</button>
          </div>
          <p style={{ fontSize: 11, color: C.muted, margin: '0 0 10px' }}>
            Some tiles on the board don't exist in <strong style={{ color: C.text }}>{newTilesetName}</strong>. Choose a replacement for each:
          </p>
          <div style={{ overflowY: 'auto', flex: 1, display: 'flex', flexDirection: 'column', gap: 8, marginBottom: 10 }}>
            {mismatches.map(m => {
              const currentRemapId = remaps[m.ref] ?? WARN_REF;
              const currentRemapTile = currentRemapId === WARN_REF ? null : (newTilesForDropdown.find(t => t.ref === currentRemapId) ?? globalTilesForDropdown.find(t => t.ref === currentRemapId));
              const isPickerOpen = openPickerFor === m.ref;
              const allPickerTiles = [
                { group: 'Incoming Tileset', tiles: newTilesForDropdown },
                { group: 'Global Tiles', tiles: globalTilesForDropdown },
              ];
              return (
                <div key={m.ref} style={{ display: 'flex', flexDirection: 'column', gap: 4, background: 'rgba(255,255,255,0.04)', borderRadius: 6, padding: '6px 8px' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                    {/* Source tile */}
                    <div className="tile-img-checker" style={{ width: 28, height: 28, borderRadius: 3, flexShrink: 0, overflow: 'hidden', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                      {m.src ? <img src={m.src} style={{ width: 28, height: 28, objectFit: 'contain', imageRendering: 'pixelated' }} /> : <span style={{ fontSize: 10, color: C.muted }}>?</span>}
                    </div>
                    <code style={{ fontSize: 11, color: C.text, flex: 1, minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                      {m.codename}
                      {m.fallbackRef != null && currentRemapId === m.fallbackRef && (
                        <span style={{ marginLeft: 5, fontSize: 9, fontWeight: 700, color: '#4ade80', background: 'rgba(74,222,128,0.14)', border: '1px solid rgba(74,222,128,0.4)', borderRadius: 3, padding: '0 3px' }}>(Global fallback)</span>
                      )}
                    </code>
                    <span style={{ fontSize: 11, color: C.muted, flexShrink: 0 }}>→</span>
                    {/* Replacement tile picker button */}
                    <button
                      onClick={() => setOpenPickerFor(p => p === m.ref ? null : m.ref)}
                      style={{ display: 'flex', alignItems: 'center', gap: 5, background: C.panel, border: `1px solid ${isPickerOpen ? C.accentBright : C.border}`, borderRadius: 5, padding: '3px 6px', cursor: 'pointer', color: C.text, fontSize: 11, flexShrink: 0 }}>
                      <div className="tile-img-checker" style={{ width: 24, height: 24, borderRadius: 2, overflow: 'hidden', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                        {currentRemapTile?.src
                          ? <img src={currentRemapTile.blobSrc ?? currentRemapTile.src} style={{ width: 24, height: 24, objectFit: 'contain', imageRendering: 'pixelated' }} />
                          : <span style={{ fontSize: 9 }}>⚠️</span>}
                      </div>
                      <span style={{ maxWidth: 80, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                        {currentRemapTile ? (currentRemapTile.codename ?? currentRemapId) : '— warn —'}
                      </span>
                      <span style={{ fontSize: 9, color: C.muted }}>▾</span>
                    </button>
                  </div>
                  {isPickerOpen && (
                    <div style={{ border: `1px solid ${C.border}`, borderRadius: 6, padding: 8, background: C.panelDeep, display: 'flex', flexDirection: 'column', gap: 8 }}>
                      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 4 }}>
                        <div
                          onClick={() => { setTilesetSwitchPending(prev => prev ? { ...prev, remaps: { ...prev.remaps, [m.ref]: WARN_REF } } : prev); setOpenPickerFor(null); }}
                          style={{ width: 32, height: 32, borderRadius: 4, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 16, border: `1px solid ${currentRemapId === WARN_REF ? C.accentBright : C.border}`, background: currentRemapId === WARN_REF ? C.accentDim : 'transparent' }}
                          title="warn tile">⚠️</div>
                      </div>
                      {allPickerTiles.map(({ group, tiles }) => tiles.length === 0 ? null : (
                        <div key={group}>
                          <div style={{ fontSize: 9, color: C.muted, textTransform: 'uppercase', letterSpacing: 0.8, marginBottom: 4 }}>{group}</div>
                          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 3 }}>
                            {tiles.map(ft => (
                              <div key={ft.ref}
                                onClick={() => { setTilesetSwitchPending(prev => prev ? { ...prev, remaps: { ...prev.remaps, [m.ref]: ft.ref } } : prev); setOpenPickerFor(null); }}
                                title={ft.codename ?? ft.ref}
                                style={{ width: 32, height: 32, borderRadius: 4, cursor: 'pointer', border: `1px solid ${currentRemapId === ft.ref ? C.accentBright : C.border}`, background: currentRemapId === ft.ref ? C.accentDim : 'transparent', overflow: 'hidden' }}>
                                <div className="tile-img-checker" style={{ width: '100%', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                                  {ft.src ? <img src={ft.blobSrc ?? ft.src} style={{ width: 28, height: 28, objectFit: 'contain', imageRendering: 'pixelated' }} /> : null}
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            <button style={{ ...btn(false), flex: 1 }} onClick={() => setTilesetSwitchPending(null)}>Cancel</button>
            <button style={{ ...btn(true, '#4ade80', 'rgba(74,222,128,0.15)'), flex: 1 }} onClick={handleConfirm}>Confirm Switch</button>
          </div>
        </div>
      </div>
    );
  };

  // ── Create Tileset ─────────────────────────────────────────────────
  const deriveFolder = name => name.replace(/ /g, '_').replace(/[^a-zA-Z0-9_-]/g, '');

  const doCreateTs = async () => {
    const name = createTsName.trim();
    const folderPath = createTsFolderPath.trim();
    if (!name || !folderPath || !createTsCodename.trim() || !createTsFile || !currentUser) return;
    setCreateTsLoading(true);
    setCreateTsError('');
    let createdTsId = null;
    let createdTileId = null;
    // Delete whatever this attempt created so nothing is left orphaned.
    const rollback = async token => {
      const failed = [];
      for (const [table, id] of [['tiles', createdTileId], ['tilesets', createdTsId]]) {
        if (!id) continue;
        try {
          const r = await workerFetch(`${WORKER_URL}/rest/v1/${table}?id=eq.${id}`, {
            method: 'DELETE', headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          });
          if (!r.ok) failed.push(`${table} ${id}`);
        } catch { failed.push(`${table} ${id}`); }
      }
      return failed;
    };
    let token = null;
    try {
      token = await getValidToken();

      // 1. Validate names (rejected, never altered)
      if (!FILE_NAME_RE.test(folderPath) || folderPath.startsWith('.') || folderPath.toLowerCase() === 'global') {
        setCreateTsError('GitHub folder path may only use letters, digits and . _ - + (and cannot be "Global").');
        setCreateTsLoading(false);
        return;
      }
      const ext = fileExtOf(createTsFile.name).toLowerCase();
      const fileName = defaultFileName({ codename: createTsCodename.trim(), ext });
      const nameErr = FILE_EXTS.includes(ext) ? checkFileName(fileName) : 'the image must be .png, .jpg, .jpeg, .gif or .webp';
      if (nameErr) {
        setCreateTsError(`Cannot use "${fileName}" as the image file name: ${nameErr}.`);
        setCreateTsLoading(false);
        return;
      }
      const filePath = `Resources/${folderPath}/${fileName}`;
      const imageUrl = rawUrl(filePath);

      // 2. Tileset row first (the worker's ownership check looks it up)
      const tsResp = await workerFetch(`${WORKER_URL}/rest/v1/tilesets`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
        body: JSON.stringify({ name, folder_path: folderPath, owner_id: currentUser.id, is_published: false }),
      });
      if (!tsResp.ok) {
        let msg = 'Failed to create tileset.';
        try { const d = await tsResp.json(); if (d.message) msg = d.message; } catch {}
        setCreateTsError(msg);
        setCreateTsLoading(false);
        return;
      }
      const tsRows = await tsResp.json();
      createdTsId = Array.isArray(tsRows) ? tsRows[0]?.id : tsRows?.id;

      // 3. Tile row
      const tileResp = await workerFetch(`${WORKER_URL}/rest/v1/tiles`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
        body: JSON.stringify({
          tileset_id: createdTsId,
          codename: createTsCodename.trim(),
          image_url: imageUrl,
          folder_key: createTsFolderKey.trim() || null,
          sort_index: createTsSortIdx !== '' ? Number(createTsSortIdx) : 0,
          rotatable: false, flippable: false, otg_passable: false,
          mirror_offset: false, bottom_render: false, priority: false,
          auto_shadow: false, show_tile_count: false,
          size_multiplier: 1.0, offset_x: 0, offset_y: 0,
        }),
      });
      if (!tileResp.ok) {
        let msg = 'Failed to create the first tile.';
        try { const d = await tileResp.json(); if (d.message) msg = d.message; } catch {}
        throw new Error(msg);
      }
      const tileRows = await tileResp.json();
      createdTileId = Array.isArray(tileRows) ? tileRows[0]?.id : tileRows?.id;

      // 4. Upload last; a failure removes both rows again
      const contentBase64 = await fileToBase64(createTsFile);
      await githubUpload(workerFetch, token, {
        filePath, contentBase64, overwrite: false,
        commitMessage: `[${currentUser.username}] New tileset: ${folderPath}`,
      });

      setTsFetchTrigger(n => n + 1);
      setCreateTsOpen(false);
      setCreateTsName(''); setCreateTsFolderPath(''); setCreateTsFile(null);
      setCreateTsCodename(''); setCreateTsFolderKey(''); setCreateTsSortIdx('');
      setCreateTsError('');
    } catch (err) {
      let msg = err.message || String(err);
      if (token && (createdTsId || createdTileId)) {
        const failed = await rollback(token);
        msg += failed.length
          ? ` — cleanup failed, remove manually: ${failed.join(', ')}`
          : ' — nothing was created.';
      }
      setCreateTsError(msg);
    }
    setCreateTsLoading(false);
  };

  const resetCreateTs = () => {
    setCreateTsOpen(false); setCreateTsName(''); setCreateTsFolderPath('');
    setCreateTsFile(null); setCreateTsCodename(''); setCreateTsFolderKey('');
    setCreateTsSortIdx(''); setCreateTsError('');
  };

  // Modal for create tileset (must come after doCreateTs to avoid TDZ)
  const createTsPreviewUrl = createTsFile ? URL.createObjectURL(createTsFile) : null;
  const createTilesetModal = !createTsOpen ? null : (
    <div className="modal-backdrop" onClick={() => { if (!createTsLoading) resetCreateTs(); }}>
      <div className="modal-box" style={{ maxWidth: 340 }} onClick={e => e.stopPropagation()}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>

        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>

          <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>

            <input value={createTsName} onChange={e => {

          </label>
          {/* Folder path */}
          <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
            <span style={{ fontSize: 11, color: C.muted }}>GitHub folder path *</span>
            <input value={createTsFolderPath} onChange={e => { setCreateTsFolderPath(e.target.value); setCreateTsError(''); }}
              placeholder="My_Tileset"
              style={{ background: "rgba(180,40,40,0.09)", border: `1px solid ${C.border}`, borderRadius: 5, color: C.text, fontFamily: "monospace", fontSize: 12, padding: "6px 8px", outline: "none", width: "100%" }} />
            <span style={{ fontSize: 10, color: C.muted }}>Used as the GitHub folder name. Cannot be changed after creation.</span>
          </label>
          {/* Divider */}
          <div style={{ borderTop: `1px solid ${C.border}`, margin: "2px 0" }} />
          {/* First tile section */}
          {createTsPreviewUrl && (
            <div style={{ background: C.panelDeep, borderRadius: 6, padding: 8, display: "flex", justifyContent: "center" }}>
              <img src={createTsPreviewUrl} alt="" style={{ maxWidth: 120, maxHeight: 120, imageRendering: "pixelated" }} />
            </div>
          )}
          <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
            <span style={{ fontSize: 11, color: C.muted }}>First tile image *</span>
            <input type="file" accept="image/*"
              onChange={e => setCreateTsFile(e.target.files?.[0] ?? null)}
              style={{ fontSize: 11, color: C.text }} />
            <span style={{ fontSize: 10, color: C.muted }}>⏱ Newly uploaded tiles may take ~5 minutes to appear due to CDN caching.</span>
          </label>
          <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
            <span style={{ fontSize: 11, color: C.muted }}>Codename *</span>
            <input value={createTsCodename} onChange={e => setCreateTsCodename(e.target.value)}
              placeholder="e.g. MyTileset_Wall1"
              style={{ background: "rgba(180,40,40,0.09)", border: `1px solid ${C.border}`, borderRadius: 5, color: C.text, fontFamily: "monospace", fontSize: 12, padding: "5px 8px", outline: "none", width: "100%" }} />
          </label>
          <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
            <span style={{ fontSize: 11, color: C.muted }}>Folder key (optional)</span>
            <input value={createTsFolderKey} onChange={e => setCreateTsFolderKey(e.target.value)}
              placeholder="e.g. Walls"
              style={{ background: "rgba(180,40,40,0.09)", border: `1px solid ${C.border}`, borderRadius: 5, color: C.text, fontFamily: "monospace", fontSize: 12, padding: "5px 8px", outline: "none", width: "100%" }} />
          </label>
          <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
            <span style={{ fontSize: 11, color: C.muted }}>Sort index (optional)</span>
            <input type="number" value={createTsSortIdx} onChange={e => setCreateTsSortIdx(e.target.value)}
              placeholder="0"
              style={{ background: "rgba(180,40,40,0.09)", border: `1px solid ${C.border}`, borderRadius: 5, color: C.text, fontFamily: "monospace", fontSize: 12, padding: "5px 8px", outline: "none", width: "100%" }} />
          </label>
          {createTsError && <span style={{ fontSize: 11, color: C.danger }}>{createTsError}</span>}
        </div>
        <div style={{ display: "flex", gap: 6, marginTop: 4 }}>
          <button style={{ ...btn(false), flex: 1, justifyContent: "center" }} disabled={createTsLoading} onClick={resetCreateTs}>Cancel</button>
          <button style={{ ...btn(true, C.accent, C.accentDim), flex: 1, justifyContent: "center" }}
            disabled={createTsLoading || !createTsName.trim() || !createTsFolderPath.trim() || !createTsCodename.trim() || !createTsFile}
            onClick={doCreateTs}>
            {createTsLoading ? 'Creating…' : 'Create Tileset'}
          </button>
        </div>
      </div>
    </div>
  );

  // ── Add Tile (doAddTile must be defined before the JSX expression that references it) ──
  const doAddTile = async () => {
    if (!addTileFile || !addTileCodename.trim() || !currentUser || !addTileTsId) return;
    const ts = dbTilesets.find(ts => ts.id === addTileTsId);
    setAddTileLoading(true);
    setAddTileError('');
    let insertedId = null;
    let token = null;
    try {
      token = await getValidToken();
      const tilesetFolderPath = ts?.folder_path;
      if (!tilesetFolderPath) throw new Error('This tileset has no GitHub folder path configured.');

      // File name = codename + original extension (never the local file name).
      // Duplicates in this tileset get _2, _3, …; the worker's 409 is the backstop.
      const ext = fileExtOf(addTileFile.name).toLowerCase();
      if (!FILE_EXTS.includes(ext)) throw new Error('The image must be .png, .jpg, .jpeg, .gif or .webp.');
      const baseName = defaultFileName({ codename: addTileCodename.trim(), ext });
      const nameErr = checkFileName(baseName);
      if (nameErr) throw new Error(`Cannot use "${baseName}" as the image file name: ${nameErr}.`);
      const existing = await ensureTilesetLoaded(addTileTsId);
      const dir = `Resources/${tilesetFolderPath}`;
      const fileName = uniqueFileName(dir, baseName, takenRepoPaths(existing));
      const filePath = `${dir}/${fileName}`;
      const imageUrl = rawUrl(filePath);
      const contentBase64 = await fileToBase64(addTileFile);

      // DB row first; if the upload then fails the row is deleted again.
      const insResp = await workerFetch(`${WORKER_URL}/rest/v1/tiles`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
        body: JSON.stringify({
          tileset_id: addTileTsId,
          codename: addTileCodename.trim(),
          image_url: imageUrl,
          folder_key: addTileFolderKey.trim() || null,
          sort_index: addTileSortIdx !== '' ? Number(addTileSortIdx) : 0,
          rotatable: false, flippable: false, otg_passable: false,
          mirror_offset: false, bottom_render: false, priority: false,
          auto_shadow: false, show_tile_count: false,
          size_multiplier: 1.0, offset_x: 0, offset_y: 0,
        }),
      });
      if (!insResp.ok) {
        let msg = 'DB insert failed';
        try {
          const errData = await insResp.json();
          console.error('[doAddTile] insert error:', insResp.status, errData);
          if (errData.code === '23505') msg = 'A tile with this codename already exists in this tileset.';
          else if (errData.message) msg = errData.message;
        } catch {}
        throw new Error(msg);
      }
      const insRows = await insResp.json();
      insertedId = Array.isArray(insRows) ? insRows[0]?.id : insRows?.id;

      await githubUpload(workerFetch, token, {
        filePath, contentBase64, overwrite: false,
        commitMessage: `[${currentUser.username}] Add tile: ${tilesetFolderPath}/${fileName}`,
      });

      setTsFetchTrigger(n => n + 1);
      setAddTileOpen(false);
      setAddTileFile(null);
      setAddTileCodename('');
      setAddTileFolderKey('');
      setAddTileSortIdx('');
    } catch (err) {
      let msg = err.message || String(err);
      if (insertedId) {
        let removed = false;
        try {
          const r = await workerFetch(`${WORKER_URL}/rest/v1/tiles?id=eq.${insertedId}`, {
            method: 'DELETE', headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          });
          removed = r.ok;
        } catch {}
        msg += removed ? ' — the tile was not created.' : ` — the upload failed and the tile row ${insertedId} could not be removed; delete it manually.`;
      }
      setAddTileError(msg);
    }
    setAddTileLoading(false);
  };

  // TilesetGearModal is defined outside App (above) — see the module-level definition.

  // ─────────────────────────────────────────────────────────────────
  // Loading screen — show while Firebase auth state is being checked or a stored session is being
  // restored (prevents login flash)
  if (!authChecked || sessionState === 'restoring') {
    return (
      <div style={{
        display: "flex", alignItems: "center", justifyContent: "center",
        height: "100dvh", background: C.bg, fontFamily: "'Inter', sans-serif",
      }}>
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 16 }}>
          <img src="favicon/apple-touch-icon.png" alt="" style={{ width: 64, height: 64, imageRendering: "auto", opacity: 0.9 }} />
          <div style={{ width: 32, height: 32, border: `3px solid ${C.border}`, borderTopColor: C.accentBright, borderRadius: "50%", animation: "oph-spin 0.8s linear infinite" }} />
        </div>
        <style>{`@keyframes oph-spin { to { transform: rotate(360deg); } }`}</style>
      </div>
    );
  }

  // Login gate — show a centered login screen when the user is not authenticated
  if (showLogin) {
    return (
      <div style={{
        display: "flex", alignItems: "center", justifyContent: "center",
        height: "100dvh", background: C.bg, fontFamily: "'Inter', sans-serif",
      }}>
        <div style={{
          display: "flex", flexDirection: "column", alignItems: "center", gap: 20,
          background: C.panel, borderRadius: 16, border: `1px solid ${C.border}`,
          padding: "40px 48px", maxWidth: 360, width: "90%",
          boxShadow: "0 8px 40px rgba(0,0,0,0.5)",
        }}>
          <img src="favicon/favicon-32x32.png" alt="" style={{ width: 48, height: 48, imageRendering: "auto" }} />
          <div style={{ textAlign: "center", display: "flex", flexDirection: "column", gap: 8 }}>
            <span className="oph-title-text" style={{ fontFamily: "'Lilita One', 'Inter', sans-serif", fontSize: 28, fontWeight: 700, letterSpacing: 0.5 }}>
              Opheliapp
            </span>
            <span style={{ fontSize: 13, color: C.muted, lineHeight: 1.6 }}>
              Custom theme tester.<br />
              Sign in to access tilesets and build maps.
            </span>
          </div>
          <button
            onClick={loginWithDiscord}
            style={{
              display: "flex", alignItems: "center", justifyContent: "center", gap: 10,
              width: "100%", padding: "11px 20px", marginTop: 4,
              background: "#5865F2", color: "#fff", border: "none", borderRadius: 8,
              fontSize: 14, fontWeight: 600, cursor: "pointer", fontFamily: "'Inter', sans-serif",
              transition: "opacity 0.12s",
            }}
            onMouseOver={e => e.currentTarget.style.opacity = "0.88"}
            onMouseOut={e => e.currentTarget.style.opacity = "1"}
          >
            <svg width="20" height="15" viewBox="0 0 127.14 96.36" fill="#fff" xmlns="http://www.w3.org/2000/svg" style={{ flexShrink: 0 }}>
              <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/>
            </svg>
            Login with Discord
          </button>
        </div>
      </div>
    );
  }

  // ─────────────────────────────────────────────────────────────────
  // Grid size in pixels (at current zoom)
  const gW = gridW * CELL * zoom;
  const gH = gridH * CELL * zoom;

  return (
    <div style={{
      display: "flex", flexDirection: "column", height: "100dvh",
      background: C.bg, color: C.text, fontFamily: "'Inter', sans-serif",
      overflow: "hidden",
      paddingTop: "env(safe-area-inset-top)", paddingBottom: "env(safe-area-inset-bottom)",
      paddingLeft: "env(safe-area-inset-left)", paddingRight: "env(safe-area-inset-right)",
    }}>

      {reconnecting && (
        <div role="status" style={{
          position: "fixed", top: 8, left: "50%", transform: "translateX(-50%)", zIndex: 5000,
          background: C.panel, color: C.text, border: `1px solid ${C.border}`, borderRadius: 8,
          padding: "6px 14px", fontSize: 12, fontWeight: 600, pointerEvents: "none",
          boxShadow: "0 4px 16px rgba(0,0,0,0.4)",
        }}>Reconnecting…</div>
      )}
      <InfoModal infoTile={infoTile} getTile={getTile} getDefaultMultiplier={getDefaultMultiplier} getTileMultiplier={getTileMultiplier} getDefaultOffset={getDefaultOffset} getTileOffset={getTileOffset} currentUser={currentUser} userProfile={userProfile} tileNames={tileNames} isPriorityTile={isPriorityTile} isBottomTile={isBottomTile} isAutoShadowTile={isAutoShadowTile} defaultPriorityTile={defaultPriorityTile} defaultBottomTile={defaultBottomTile} defaultAutoShadowTile={defaultAutoShadowTile} setTileMultipliers={setTileMultipliers} setTileOffsets={setTileOffsets} getValidToken={getValidToken} workerFetch={workerFetch} setTsFetchTrigger={setTsFetchTrigger} setInfoTile={setInfoTile} userTiles={userTiles} tiles={tiles} setTileNames={setTileNames} btn={btn} isTileRotatable={isTileRotatable} isDefaultRotatable={isDefaultRotatable} isFlipAllowed={isFlipAllowed} isDefaultFlippable={isDefaultFlippable} isOTGWall={isOTGWall} isDefaultOTGWall={isDefaultOTGWall} otgWallOverrides={otgWallOverrides} isMirrorOffset={isMirrorOffset} isDefaultMirrorOffset={isDefaultMirrorOffset} setRotatableMap={setRotatableMap} setCardRotations={setCardRotations} setCardFlipSteps={setCardFlipSteps} setCardFlipModes={setCardFlipModes} setAllowFlipMap={setAllowFlipMap} cardFlipModes={cardFlipModes} setOtgWallOverrides={setOtgWallOverrides} setMirrorOffsetTiles={setMirrorOffsetTiles} setBottomTiles={setBottomTiles} setPriorityTiles={setPriorityTiles} setAutoShadowTiles={setAutoShadowTiles} setDbTilesByTsId={setDbTilesByTsId} starredTiles={starredTiles} toggleStar={toggleStar} dbTilesets={dbTilesets} dbTilesByTsId={dbTilesByTsId} deleteTile={deleteTile} />
      <ReplaceModal />
      <OTGSettingsModal />
      <HistoryModal />
      <FailedTileModal />
      {sensorWarnFolder && <SensorWarningModal folder={sensorWarnFolder} onClose={() => setSensorWarnFolder(null)} />}
      {sensorSimFolder && sensorFolders.get(sensorSimFolder) && (
        <SensorSimulationPanel folder={sensorFolders.get(sensorSimFolder).ui} candidates={sensorFolders.get(sensorSimFolder).candidates} requestComposed={requestComposed} onClose={() => setSensorSimFolder(null)} />
      )}
      <ToolInfoModal />
      <MemoryModal />
      <ConvertModal />
      <TilesetCompatModal />
      <HotkeysModal />
      {clearMapConfirmOpen && (
        <div className="modal-backdrop" onClick={() => setClearMapConfirmOpen(false)}>
          <div className="modal-box" style={{ maxWidth: 340 }} onClick={e => e.stopPropagation()}>

                    const isFlipMode = mode === 'flip';
                    const fx = (flipStep === 1 || flipStep === 2) ? -1 : 1;
                    const fy = (flipStep === 2 || flipStep === 3) ? -1 : 1;

                    return (
                      <div key={t.ref}
                        onClick={() => {

                              setCardRotations(prev => ({ ...prev, [t.ref]: (prev[t.ref] ?? 0) + 90 }));

                          setSel(t.ref); setEraser(false);
                          setHandMode(false); setMagnetMode(false); setEyedropperMode(false);
                          if (highlightMode) { setHighlightMode(false); setHighlightedCells(new Set()); highlightedCellsRef.current = new Set(); setPrimaryHighlightedCells(new Set()); primaryHighlightedCellsRef.current = new Set(); }

              spellCheck={false} />
            <button style={btn(true, "#ef4444", "rgba(239,68,68,0.25)")}
              onClick={() => setClearMapConfirmOpen(true)}>
              Clear Map
            </button>
            <button style={btn(true, C.soft, C.softDim)} onClick={() => setDownloadConfirmOpen(true)}>Download</button>
          </div>

          {/* Row 3: History */}
          <div style={{ display: "flex", justifyContent: "center", alignItems: "center", gap: 8, padding: "3px 14px" }}>
            <button style={btn(true, C.accent, C.accentDim)}
              title={`History (${histIdx + 1}/${history.length})`}
              onClick={() => setHistoryModalOpen(true)}>🕘 Show History</button>
          </div>

          {/* Row 3: Background colour selector */}
          {(() => {
            const byAlpha = (a, b) => a.name.localeCompare(b.name);
            const sortedTilesets = [...dbTilesets].sort(byAlpha);
            const getBgForTs = ts => {
              if (ts.bg_color_light && ts.bg_color_dark) return { bg1: ts.bg_color_light, bg2: ts.bg_color_dark };
              return OPHELIA_BG[ts.name] ?? { bg1: "#1a2332", bg2: "#1e2838" };
            };
            const isAdmin = userProfile?.role === 'admin';
            const activePresetLabel = selectedBgPreset === 'custom' ? '✏ Custom' : (selectedBgPreset ?? 'Custom');
            const renderBgItem = ts => {
              const checked = selectedBgPreset === ts.name;
              const nameColor = checked ? C.accentBright : C.text;
              return (
                <div key={ts.name}
                  style={{ display: "flex", alignItems: "center", gap: 6, padding: "4px 9px", cursor: "pointer", userSelect: "none", background: checked ? "rgba(255,255,255,0.05)" : "transparent" }}
                  onClick={() => {
                    const p = getBgForTs(ts);
                    histLabelRef.current = "Background";
                    pushHistorySnapshot();
                    applyBgPreset(ts.name, p.bg1, p.bg2);
                    setBgDropOpen(false);
                  }}>
                  {(() => { const p = getBgForTs(ts); return (<><div style={{ width: 10, height: 10, borderRadius: 2, background: p.bg1, border: `1px solid ${C.border}`, flexShrink: 0 }} /><div style={{ width: 10, height: 10, borderRadius: 2, background: p.bg2, border: `1px solid ${C.border}`, flexShrink: 0 }} /></>); })()}
                  <span style={{ fontSize: 11, color: nameColor, fontWeight: checked ? 600 : 400 }}>
                    {ts.name}
                    {ts.is_wip && <span style={{ marginLeft: 4, fontSize: 8, fontWeight: 700, color: "#fbbf24", background: "rgba(251,191,36,0.12)", border: "1px solid rgba(251,191,36,0.35)", borderRadius: 3, padding: "0 3px", verticalAlign: "middle" }}>WIP</span>}
                    {isAdmin && !ts.is_published && <span style={{ marginLeft: 4, fontSize: 8, fontWeight: 700, color: "#f97316", background: "rgba(249,115,22,0.12)", border: "1px solid rgba(249,115,22,0.3)", borderRadius: 3, padding: "0 3px", verticalAlign: "middle" }}>HIDDEN</span>}
                  </span>
                </div>
              );
            };
            return (
              <div style={{ display: "flex", flexWrap: "wrap", gap: 8, padding: "3px 14px 5px", alignItems: "center", position: "relative" }}>
                <span style={{ fontSize: 10, color: C.muted, textTransform: "uppercase", letterSpacing: 1, userSelect: "none" }}>Background</span>
                {/* Swatches */}
                <div style={{ display: "flex", alignItems: "center", gap: 3 }}>
                  <div style={{ width: 14, height: 14, borderRadius: 3, background: bg1, border: `1px solid ${C.border}`, flexShrink: 0 }} />
                  <div style={{ width: 14, height: 14, borderRadius: 3, background: bg2, border: `1px solid ${C.border}`, flexShrink: 0 }} />
                </div>
                {/* Custom dropdown trigger */}
                <div style={{ position: "relative" }}>
                  <button
                    style={{ ...btn(false, selectedBgPreset === 'custom' ? C.accent : C.accentBright, selectedBgPreset === 'custom' ? C.accentDim : "rgba(74,222,128,0.08)"), fontSize: 10, padding: "2px 7px", fontStyle: selectedBgPreset === 'custom' ? "italic" : "normal" }}
                    onClick={() => setBgDropOpen(v => !v)}>
                    {activePresetLabel} ▾
                  </button>
                  {bgDropOpen && (
                    <div onMouseDown={e => e.stopPropagation()} style={{ position: "absolute", bottom: "100%", top: "auto", left: 0, background: C.panelDeep, border: `1px solid ${C.border}`, borderRadius: 6, zIndex: 300, padding: "4px 0", minWidth: 180, maxHeight: "60vh", overflowY: "auto", boxShadow: "0 -4px 16px rgba(0,0,0,0.45)" }}>
                      {/* Custom */}
                      <div style={{ display: "flex", alignItems: "center", gap: 6, padding: "4px 9px", cursor: "pointer", userSelect: "none", background: selectedBgPreset === 'custom' ? "rgba(255,255,255,0.05)" : "transparent" }}
                        onClick={() => { applyBgPreset("custom", customBg.bg1, customBg.bg2); setCustomBgDraft({ bg1, bg2 }); setCustomBgModalOpen(true); setBgDropOpen(false); }}>
                        <div style={{ width: 10, height: 10, borderRadius: 2, background: customBg.bg1, border: `1px solid ${C.border}`, flexShrink: 0 }} />
                        <div style={{ width: 10, height: 10, borderRadius: 2, background: customBg.bg2, border: `1px solid ${C.border}`, flexShrink: 0 }} />
                        <span style={{ fontSize: 11, color: selectedBgPreset === 'custom' ? C.accent : C.text, fontStyle: "italic" }}>✏ Custom…</span>
                      </div>
                      {sortedTilesets.map(renderBgItem)}
                    </div>
                  )}
                </div>
                {selectedBgPreset === "custom" && (
                  <button style={{ ...btn(false), fontSize: 10, padding: "2px 7px" }}
                    onClick={() => { setCustomBgDraft({ bg1, bg2 }); setCustomBgModalOpen(true); }}>
                    Edit…
                  </button>
                )}
              </div>
            );
          })()}

          {/* Custom Background modal */}
          {customBgModalOpen && (() => {
            const cancelBg = () => {
              if (customBgDraft) {
                setBg1(customBgDraft.bg1); setHex1(customBgDraft.bg1);
                setBg2(customBgDraft.bg2); setHex2(customBgDraft.bg2);
                setCustomBg(prev => { const n = { ...prev, bg1: customBgDraft.bg1, bg2: customBgDraft.bg2 }; save("oph_custom_bg", n); return n; });
              }
              setCustomBgModalOpen(false);
              setCustomBgDraft(null);
            };
            const applyBg = () => { setCustomBgModalOpen(false); setCustomBgDraft(null); };
            return (
              <div className="modal-backdrop" onClick={cancelBg}>
                <div className="modal-box" style={{ maxWidth: 280 }} onClick={e => e.stopPropagation()}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                    <span style={{ fontSize: 13, fontWeight: 700, color: C.accentBright }}>Custom Background</span>
                    <button onClick={applyBg} style={{ background: "none", border: "none", cursor: "pointer", color: C.muted, fontSize: 18 }}>×</button>
                  </div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <span style={{ fontSize: 11, color: C.muted, width: 14, textAlign: "center", fontWeight: 600 }}>A</span>
                      <input type="color" value={customBg.bg1}
                        onChange={e => applyBg1(e.target.value)}
                        style={{ width: 32, height: 32, border: "none", borderRadius: 5, cursor: "pointer", padding: 2, background: "none", flexShrink: 0 }} />
                      <input type="text" value={hex1} maxLength={7}
                        onChange={e => { const v = e.target.value; setHex1(v); if (validHex(v)) applyBg1(v); }}
                        onBlur={() => { if (!validHex(hex1)) setHex1(customBg.bg1); }}
                        style={{ flex: 1, background: "rgba(180,40,40,0.09)", border: `1px solid ${C.border}`, borderRadius: 5, color: C.text, fontFamily: "monospace", fontSize: 11, padding: "5px 8px", outline: "none" }}
                        spellCheck={false} />
                    </div>
                    <div style={{ display: "flex", justifyContent: "center" }}>
                      <button style={{ ...btn(false), fontSize: 11, padding: "3px 14px" }}
                        onClick={() => { applyBg1(customBg.bg2); applyBg2(customBg.bg1); }}
                        title="Swap colours">⇄ Swap</button>
                    </div>
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <span style={{ fontSize: 11, color: C.muted, width: 14, textAlign: "center", fontWeight: 600 }}>B</span>
                      <input type="color" value={customBg.bg2}
                        onChange={e => applyBg2(e.target.value)}
                        style={{ width: 32, height: 32, border: "none", borderRadius: 5, cursor: "pointer", padding: 2, background: "none", flexShrink: 0 }} />
                      <input type="text" value={hex2} maxLength={7}
                        onChange={e => { const v = e.target.value; setHex2(v); if (validHex(v)) applyBg2(v); }}
                        onBlur={() => { if (!validHex(hex2)) setHex2(customBg.bg2); }}
                        style={{ flex: 1, background: "rgba(180,40,40,0.09)", border: `1px solid ${C.border}`, borderRadius: 5, color: C.text, fontFamily: "monospace", fontSize: 11, padding: "5px 8px", outline: "none" }}
                        spellCheck={false} />
                    </div>
                    <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
                      <button style={{ ...btn(false), flex: 1, fontSize: 11, justifyContent: "center" }} onClick={cancelBg}>Cancel</button>
                      <button style={{ ...btn(false, '#4ade80', 'rgba(74,222,128,0.15)'), flex: 1, fontSize: 11, justifyContent: "center" }} onClick={applyBg}>Apply</button>
                    </div>
                  </div>
                </div>
              </div>
            );
          })()}

          {/* Row 4: Map size */}
          <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "3px 14px" }}>
            <span style={{ fontSize: 10, color: C.muted, textTransform: "uppercase", letterSpacing: 1, userSelect: "none" }}>Map size</span>
            {(() => {
              const isCustom = !(gridW === 21 && gridH === 33) && !(gridW === 60 && gridH === 60);
              const curVal = gridW === 21 && gridH === 33 ? "3v3" : gridW === 60 && gridH === 60 ? "showdown" : `custom_${gridW}_${gridH}`;
              return (
                <select
                  value={curVal}
                  onChange={e => {
                    const v = e.target.value;
                    if (v === "3v3") { setSizeWInput("21"); setSizeHInput("33"); setPendingSize({ w: 21, h: 33 }); }
                    else if (v === "showdown") { setSizeWInput("60"); setSizeHInput("60"); setPendingSize({ w: 60, h: 60 }); }
                    else if (v === "custom") { setSizeWInput(String(gridW)); setSizeHInput(String(gridH)); setCustomSizeOpen(true); }
                  }}
                  style={{ background: C.panel, color: C.text, border: `1px solid ${C.border}`, borderRadius: 5, fontSize: 10, padding: "3px 5px", cursor: "pointer", outline: "none" }}>
                  <option value="3v3">3v3 (21×33)</option>
                  <option value="showdown">Showdown (60×60)</option>
                  {isCustom && <option value={`custom_${gridW}_${gridH}`}>Custom ({gridW}×{gridH})</option>}
                  <option value="custom">Custom Map Size…</option>
                </select>
              );
            })()}
          </div>

        </>)}

      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
