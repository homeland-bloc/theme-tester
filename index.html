  const resp = await workerFetch(`${WORKER_URL}${route}`, {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!resp.ok) {
    const e = await workerErrorMessage(resp, fallback);
    throw Object.assign(new Error(e.message), { status: e.status, data: e.data });
  }
  return resp.json();
}
const githubUpload = (workerFetch, token, { filePath, contentBase64, commitMessage, overwrite = false }) =>
  workerJson(workerFetch, token, '/github/upload', { filePath, contentBase64, commitMessage, overwrite }, 'GitHub upload failed');
const githubMove = (workerFetch, token, { moves, deleteOld, commitMessage }) =>
  workerJson(workerFetch, token, '/github/move', { moves, deleteOld, commitMessage }, 'GitHub move failed');
const githubDeleteMany = (workerFetch, token, { paths, commitMessage }) =>
  workerJson(workerFetch, token, '/github/delete-many', { paths, commitMessage }, 'GitHub delete failed');

// ── TypeToConfirmModal — destructive actions need the exact name typed before Delete enables.
function TypeToConfirmModal({ title, message, expected, placeholder, confirmLabel = 'Delete', busy, error, onConfirm, onCancel }) {

    <div style={{ position: 'fixed', inset: 0, zIndex: 10000, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'rgba(0,0,0,0.65)' }}

// ── BulkRenameModal — rename every tile file in a tileset to its codename.
//    Step 1 dry run -> step 2 copy to new names + repoint DB -> step 3 delete old files.
//    Copy-first, so the live tileset never points at a missing file.
function BulkRenameModal({ tsData, dbTilesByTsId, currentUser, getValidToken, workerFetch, onClose, onChanged }) {
  const [rows, setRows] = React.useState(null);     // null until the dry run has been built
  const [busy, setBusy] = React.useState(false);
  const [progress, setProgress] = React.useState('');
  const [message, setMessage] = React.useState(null); // { kind: 'ok'|'err', text }
  const folder = tsData.folder_path;
  const prefix = `Resources/${folder}/`;

  const fetchRows = async token => {
    const r = await workerFetch(`${WORKER_URL}/rest/v1/tiles?tileset_id=eq.${tsData.id}&select=*&order=sort_index`, {
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
    });
    if (!r.ok) throw new Error((await workerErrorMessage(r, 'Could not load tiles')).message);
    const data = await r.json();
    return Array.isArray(data) ? data : [];
  };

  // Step 1 — pure planning, nothing is written.
  const buildPlan = async () => {
    setBusy(true); setMessage(null); setProgress('Loading tiles…');
    try {
      const token = await getValidToken();
      const dbRows = await fetchRows(token);
      const occupied = new Set();
      for (const r of dbRows) { const pth = repoPathFromUrl(r.image_url); if (pth) occupied.add(pth.toLowerCase()); }
      const claimed = new Set();
      const plan = dbRows.map(r => {
        const oldPath = repoPathFromUrl(r.image_url);
        const row = { id: r.id, codename: r.codename, oldPath, newPath: null, status: 'rename', error: null,
          oldName: oldPath ? fileNameOf(oldPath) : String(r.image_url).split('?')[0].split('/').pop(), newName: '' };
        if (!oldPath) { row.status = 'external'; return row; }
        if (!oldPath.startsWith(prefix)) { row.status = 'other-folder'; return row; }
        const sensor = !!r.sensor_code;
        const desired = defaultFileName({ codename: r.codename, folderKey: r.folder_key, sensorCode: r.sensor_code, ext: fileExtOf(row.oldName), sensor });
        if (!desired) { row.status = 'invalid'; row.error = 'sensor tile needs a folder_key'; return row; }
        const nameErr = checkFileName(desired);
        if (nameErr) { row.status = 'invalid'; row.newName = desired; row.error = nameErr; return row; }
        row.newName = desired;
        row.newPath = `${dirOf(oldPath)}/${desired}`;
        row.sensor = sensor;
        if (row.newPath === oldPath) { row.status = 'ok'; claimed.add(oldPath.toLowerCase()); }
        return row;
      });
      for (const row of plan) {
        if (row.status !== 'rename') continue;
        let target = row.newPath;
        const taken = new Set([...occupied, ...claimed]);
        if (taken.has(target.toLowerCase())) {
          if (row.sensor) {
            row.newName = uniqueFileName(dirOf(target), row.newName, taken);
            target = `${dirOf(target)}/${row.newName}`;
          } else {
            row.status = 'collision';
            row.error = 'another file in this tileset already uses that name';
            continue;
          }
        }
        row.newPath = target;
        claimed.add(target.toLowerCase());
      }
      setRows(plan);
      setProgress('');
    } catch (err) {
      setMessage({ kind: 'err', text: err.message });
      setProgress('');
    }
    setBusy(false);
  };

  const patchRow = (id, patch) => setRows(prev => prev.map(r => r.id === id ? { ...r, ...patch } : r));

  // Step 2 — one /github/move copy (deleteOld:false), then repoint each tile.
  const doCopy = async () => {
    setBusy(true); setMessage(null);
    try {
      const token = await getValidToken();
      const pending = rows.filter(r => r.status === 'rename');
      const copiedNow = [];
      if (pending.length) {
        setProgress(`Copying ${pending.length} file(s) to their new names…`);
        for (let i = 0; i < pending.length; i += 500) {
          const chunk = pending.slice(i, i + 500);
          try {
            await githubMove(workerFetch, token, {
              moves: chunk.map(r => ({ from: r.oldPath, to: r.newPath })), deleteOld: false,
              commitMessage: `[${currentUser.username}] Copy ${chunk.length} tile file(s) to codename names: ${folder}`,
            });
            chunk.forEach(r => { patchRow(r.id, { status: 'copied', error: null }); copiedNow.push(r); });
          } catch (err) {
            // The worker validates everything first, so a failed request changed nothing on GitHub.
            const bad = new Map((err.data?.results || []).filter(x => x.ok === false).map(x => [x.from, x.error]));
            chunk.forEach(r => patchRow(r.id, bad.has(r.oldPath) ? { status: 'failed', error: bad.get(r.oldPath) } : {}));
            setMessage({ kind: 'err', text: `Copy failed, no file was changed on GitHub: ${err.message}. Fix the flagged rows and run the dry run again.` });
            setProgress('');
            setBusy(false);
            return;
          }
        }
      }
      // DB repoint: everything that is copied but not yet pointing at its new file
      const toPatch = [...rows.filter(r => r.status === 'copied'), ...copiedNow];
      let done = 0, failed = 0;
      const queue = toPatch.slice();
      const worker = async () => {
        while (queue.length) {
          const r = queue.shift();
          try {
            const resp = await workerFetch(`${WORKER_URL}/rest/v1/tiles?id=eq.${r.id}`, {
              method: 'PATCH',
              headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
              body: JSON.stringify({ image_url: rawUrl(r.newPath), last_updated_at: new Date().toISOString(), last_updated_by: currentUser.id }),
            });
            if (resp.ok) { patchRow(r.id, { status: 'done', error: null }); done++; }
            else { patchRow(r.id, { error: 'DB update failed: ' + (await workerErrorMessage(resp, 'PATCH failed')).message }); failed++; }
          } catch (e) { patchRow(r.id, { error: 'DB update failed: ' + e.message }); failed++; }
          setProgress(`Updating database… ${done + failed}/${toPatch.length}`);
        }
      };
      await Promise.all([worker(), worker(), worker(), worker()]);
      setProgress('');
      setMessage(failed
        ? { kind: 'err', text: `${done} tile(s) updated, ${failed} failed. The new files exist on GitHub; press the copy button again to retry the database updates.` }
        : { kind: 'ok', text: `${done} tile(s) now point at their new file names. The old files are still on GitHub — delete them in step 3 once you are happy.` });
      onChanged();
    } catch (err) {
      setMessage({ kind: 'err', text: err.message });
      setProgress('');
    }
    setBusy(false);
  };

  // Step 3 — delete old files that no tile references any more (one commit per 500).
  const doDeleteOld = async () => {
    setBusy(true); setMessage(null); setProgress('Checking which old files are still referenced…');
    try {
      const token = await getValidToken();
      const fresh = await fetchRows(token);
      const refs = new Set();
      for (const r of fresh) { const pth = repoPathFromUrl(r.image_url); if (pth) refs.add(pth.toLowerCase()); }
      for (const [tsId, list] of Object.entries(dbTilesByTsId)) {
        if (tsId === tsData.id) continue;
        for (const r of list || []) { const pth = repoPathFromUrl(r.image_url); if (pth) refs.add(pth.toLowerCase()); }
      }
      const candidates = rows.filter(r => r.status === 'done' && r.oldPath && !r.deleted);
      const deletable = [...new Set(candidates.filter(r => !refs.has(r.oldPath.toLowerCase())).map(r => r.oldPath))];
      candidates.filter(r => refs.has(r.oldPath.toLowerCase())).forEach(r => patchRow(r.id, { error: 'old file kept: another tile still references it' }));
      let removed = 0;
      for (let i = 0; i < deletable.length; i += 500) {
        const chunk = deletable.slice(i, i + 500);
        setProgress(`Deleting old files… ${i}/${deletable.length}`);
        try {
          await githubDeleteMany(workerFetch, token, { paths: chunk, commitMessage: `[${currentUser.username}] Delete old tile files: ${folder}` });
          rows.filter(r => chunk.includes(r.oldPath) && r.status === 'done').forEach(r => patchRow(r.id, { deleted: true, error: null }));
          removed += chunk.length;
        } catch (err) {
          setMessage({ kind: 'err', text: `Deleting old files failed after ${removed}: ${err.message}` });
          setProgress('');
          setBusy(false);
          return;
        }
      }
      setProgress('');
      setMessage({ kind: 'ok', text: `${removed} old file(s) deleted${candidates.length > deletable.length ? `; ${candidates.length - deletable.length} kept because they are still referenced` : ''}.` });
    } catch (err) {
      setMessage({ kind: 'err', text: err.message });
      setProgress('');
    }
    setBusy(false);
  };

  const count = st => rows ? rows.filter(r => r.status === st).length : 0;
  const nRename = count('rename');
  const nCopied = count('copied');
  const nDeletable = rows ? rows.filter(r => r.status === 'done' && !r.deleted).length : 0;
  const badge = { rename: ['rename', '#fbbf24'], ok: ['already correct', '#4ade80'], external: ['external', C.muted], 'other-folder': ['other folder', C.muted],
    invalid: ['invalid', C.danger], collision: ['collision', C.danger], copied: ['copied, DB pending', '#fbbf24'], done: ['done', '#4ade80'], failed: ['failed', C.danger] };
  const bs = (on, color) => ({ padding: '5px 11px', borderRadius: 7, fontSize: 12, fontWeight: 600, cursor: on ? 'pointer' : 'not-allowed', opacity: on ? 1 : 0.4, background: 'rgba(255,255,255,0.04)', color, border: `1px solid ${color}` });

  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 9000, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'rgba(0,0,0,0.65)' }}
      onClick={e => { e.stopPropagation(); if (!busy) onClose(); }}>
      <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 10, padding: '16px 18px', width: 'min(680px, 96vw)', maxHeight: '90vh', display: 'flex', flexDirection: 'column', gap: 10 }}
        onClick={e => e.stopPropagation()}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          <span style={{ fontSize: 14, fontWeight: 700, color: C.accentBright }}>Rename files to codenames — {tsData.name}</span>
          <button disabled={busy} onClick={onClose} style={{ background: 'none', border: 'none', cursor: 'pointer', color: C.muted, fontSize: 18, lineHeight: 1 }}>×</button>
        </div>
        <span style={{ fontSize: 10, color: C.muted, lineHeight: 1.5 }}>
          1) Dry run shows every change. 2) Copy creates the new files in one commit and repoints the tiles; old files stay. 3) Delete old files removes only files no tile references. Sensor tiles use folder_key_sensorcode.png.
        </span>
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
          <button disabled={busy} style={bs(!busy, C.accent)} onClick={buildPlan}>1. Dry run</button>
          <button disabled={busy || (nRename + nCopied) === 0} style={bs(!busy && (nRename + nCopied) > 0, '#fbbf24')} onClick={doCopy}>
            2. {nCopied && !nRename ? `Retry DB updates (${nCopied})` : `Copy to new names (${nRename})`}
          </button>
          <button disabled={busy || nDeletable === 0} style={bs(!busy && nDeletable > 0, C.danger)} onClick={doDeleteOld}>3. Delete old files ({nDeletable})</button>
        </div>
        {progress && <span style={{ fontSize: 11, color: C.accentBright }}>{progress}</span>}
        {message && <span style={{ fontSize: 11, color: message.kind === 'ok' ? '#4ade80' : C.danger, wordBreak: 'break-word' }}>{message.text}</span>}
        {rows && (
          <>
            <span style={{ fontSize: 10, color: C.muted }}>
              {rows.length} tile(s): {nRename} to rename, {count('ok')} already correct, {count('collision')} collisions, {count('invalid')} invalid, {count('external') + count('other-folder')} skipped (external / other folder)
            </span>
            <div style={{ overflowY: 'auto', border: `1px solid ${C.border}`, borderRadius: 6 }}>
              <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 11, fontFamily: 'monospace', color: C.text }}>
                <thead><tr style={{ textAlign: 'left', color: C.muted, position: 'sticky', top: 0, background: C.panel }}>
                  <th style={{ padding: '4px 6px' }}>Old name</th><th style={{ padding: '4px 6px' }}>New name</th><th style={{ padding: '4px 6px' }}>Status</th>
                </tr></thead>
                <tbody>
                  {rows.map(r => {
                    const [label, color] = badge[r.status] || [r.status, C.muted];
                    return (
                      <tr key={r.id} style={{ borderTop: `1px solid ${C.border}` }}>
                        <td style={{ padding: '3px 6px', wordBreak: 'break-all' }}>{r.oldName}</td>
                        <td style={{ padding: '3px 6px', wordBreak: 'break-all' }}>{r.status === 'ok' || r.status === 'external' || r.status === 'other-folder' ? '—' : r.newName}</td>
                        <td style={{ padding: '3px 6px', color }}>{r.deleted ? 'done, old deleted' : label}{r.error ? <div style={{ color: C.danger, fontSize: 10 }}>{r.error}</div> : null}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

// ── TilesetGearModal — defined OUTSIDE App so its component identity is stable.
//    When defined inside App, React sees a new function type every render and
//    unmounts+remounts the modal (losing input focus on every keystroke).
function TilesetGearModal({
  open, tsId, name, onNameChange,
  dbTilesets, onDbTilesetsChange,
  currentUser, userProfile, getValidToken, workerFetch, dbTilesByTsId,
  onClose, onTsFetchTrigger, onActiveTilesetChange,
}) {
  const [bulkOpen, setBulkOpen] = React.useState(false);
  const [saving,            setSaving]            = React.useState(false);
  const [saveNameStatus,    setSaveNameStatus]    = React.useState(null);
  const [deleteConfirm,     setDeleteConfirm]     = React.useState(false);
  const [gearBg1,           setGearBg1]           = React.useState('');
  const [gearBg2,           setGearBg2]           = React.useState('');
  const [gearHex1,          setGearHex1]          = React.useState('');
  const [gearHex2,          setGearHex2]          = React.useState('');
  const [bgSaveStatus,      setBgSaveStatus]      = React.useState(null);
  const [deleteBusy,        setDeleteBusy]        = React.useState(false);
  const [deleteError,       setDeleteError]       = React.useState(null);
  const [transferStatus,        setTransferStatus]        = React.useState(null); // null|'confirm'|'saving'|'ok'|'err'
  const [transferTargetId,      setTransferTargetId]      = React.useState(null);
  const [transferTargetName,    setTransferTargetName]    = React.useState('');
  const [selectedTransferUserId, setSelectedTransferUserId] = React.useState('');
  const [profilesList,          setProfilesList]          = React.useState([]);
  const [profilesLoading,       setProfilesLoading]       = React.useState(false);

  const tsData = (open && tsId) ? dbTilesets.find(ts => ts.id === tsId) : null;

  // Tile count for the delete button: from the loaded cache, else one id-only read (no cascade delete exists).
  const [fetchedTileCount, setFetchedTileCount] = React.useState(null);
  const cachedTileRows = tsId ? dbTilesByTsId?.[tsId] : undefined;
  const tileCount = cachedTileRows !== undefined ? cachedTileRows.length : fetchedTileCount;
  React.useEffect(() => {
    setFetchedTileCount(null);
    if (!open || !tsId || cachedTileRows !== undefined) return;
    let cancelled = false;
    (async () => {
      try {
        const token = await getValidToken();
        const r = await workerFetch(`${WORKER_URL}/rest/v1/tiles?tileset_id=eq.${tsId}&select=id`, {
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        });
        const rows = r.ok ? await r.json() : null;
        if (!cancelled && Array.isArray(rows)) setFetchedTileCount(rows.length);
      } catch {}
    })();
    return () => { cancelled = true; };
  }, [open, tsId, cachedTileRows === undefined]);

  // Re-initialise colour inputs and reset modal state whenever the target tileset changes
  React.useEffect(() => {
    if (tsData) {

  const saveName = async () => {

    if (!trimmed || trimmed === tsData.name || !canManage) return;
    setSaving(true);
    try {
      const token = await getValidToken();
      const r = await workerFetch(`${WORKER_URL}/rest/v1/tilesets?id=eq.${tsId}`, {
        method: 'PATCH',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
        body: JSON.stringify({ name: trimmed }),
      });
      if (r.ok) {
        onDbTilesetsChange(prev => prev.map(ts => ts.id === tsId ? { ...ts, name: trimmed } : ts));

    setSaving(false);
  };

    if (!canManage) return;
    const newPub = !isPub;
    try {
      const token = await getValidToken();
      const r = await workerFetch(`${WORKER_URL}/rest/v1/tilesets?id=eq.${tsId}`, {
        method: 'PATCH',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },

      if (r.ok) onDbTilesetsChange(prev => prev.map(ts => ts.id === tsId ? { ...ts, is_published: newPub } : ts));

    } catch (err) { alert('Error: ' + err.message); }
  };

  const toggleWip = async () => {
    if (!canManage) return;
    const newWip = !isWip;
    try {
      const token = await getValidToken();
      const r = await workerFetch(`${WORKER_URL}/rest/v1/tilesets?id=eq.${tsId}`, {
        method: 'PATCH',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
        body: JSON.stringify({ is_wip: newWip }),
      });
      if (r.ok) onDbTilesetsChange(prev => prev.map(ts => ts.id === tsId ? { ...ts, is_wip: newWip } : ts));

    } catch (err) { alert('Error: ' + err.message); }

      const r = await workerFetch(`${WORKER_URL}/rest/v1/tilesets?id=eq.${tsId}`, {
        method: 'PATCH',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },

      if (r.ok) {
        onDbTilesetsChange(prev => prev.map(ts => ts.id === tsId ? { ...ts, bg_color_light: b1, bg_color_dark: b2 } : ts));

      } else {

  };

    setDeleteError(null);

          {isAdmin && (

              <span style={{ fontSize: 11, color: C.muted, fontWeight: 600 }}>Transfer Ownership</span>

                    <button style={{ ...btn(true, '#fbbf24', 'rgba(251,191,36,0.15)'), flex: 1, fontSize: 11 }}
                      onClick={async () => {

                        try {
                          const token = await getValidToken();
                          const r = await workerFetch(`${WORKER_URL}/rest/v1/tilesets?id=eq.${tsId}`, {
                            method: 'PATCH',
                            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },

                          if (r.ok) {

                  </div>
                  {transferStatus === 'err' && <span style={{ fontSize: 10, color: C.danger }}>Transfer failed.</span>}
                </div>
              ) : transferStatus === 'ok' ? (
                <span style={{ fontSize: 11, color: '#4ade80' }}>✓ Ownership transferred</span>
              ) : (
                <div style={{ display: "flex", gap: 6 }}>
                  <select
                    value={selectedTransferUserId}
                    onChange={e => setSelectedTransferUserId(e.target.value)}
                    disabled={profilesLoading}
                    style={{ flex: 1, background: "rgba(30,15,15,0.85)", border: `1px solid ${C.border}`, borderRadius: 5, color: C.text, fontFamily: "monospace", fontSize: 11, padding: "4px 7px", outline: "none" }}>
                    <option value="">{profilesLoading ? 'Loading…' : '— select user —'}</option>
                    {profilesList.filter(p => p.id !== tsData.owner_id).map(p => (
                      <option key={p.id} value={p.id}>{p.username}</option>
                    ))}
                  </select>
                  <button
                    style={{ ...btn(true, '#fbbf24', 'rgba(251,191,36,0.15)'), fontSize: 11, padding: "4px 10px" }}
                    disabled={!selectedTransferUserId || profilesLoading}
                    onClick={() => {
                      const profile = profilesList.find(p => p.id === selectedTransferUserId);
                      if (!profile) return;
                      setTransferTargetId(profile.id);
                      setTransferTargetName(profile.username);
                      setTransferStatus('confirm');
                    }}>
                    Transfer
                  </button>
                </div>
              )}
            </div>
          )}
          {/* Bulk rename tile files to codenames — owners/admins */}
          {canManage && tsData.folder_path && (
            <div style={{ borderTop: `1px solid ${C.border}`, paddingTop: 8 }}>
              <button style={{ ...btn(true, '#fbbf24', 'rgba(251,191,36,0.15)'), justifyContent: "center", fontSize: 11, width: "100%" }}
                onClick={() => setBulkOpen(true)}>
                ✏️ Rename files to codenames
              </button>
            </div>
          )}
          {bulkOpen && canManage && (
            <BulkRenameModal tsData={tsData} dbTilesByTsId={dbTilesByTsId || {}} currentUser={currentUser}
              getValidToken={getValidToken} workerFetch={workerFetch}
              onClose={() => setBulkOpen(false)} onChanged={onTsFetchTrigger} />
          )}
          {/* Delete tileset — owners/admins only; exact tileset name must be typed in a modal */}
          {canManage && (
            <div style={{ borderTop: `1px solid ${C.border}`, paddingTop: 8 }}>
              <button style={{ ...btn(tileCount === 0, C.danger, "rgba(248,113,113,0.18)"), justifyContent: "center", fontSize: 11, width: "100%", opacity: tileCount === 0 ? 1 : 0.6, cursor: tileCount === 0 ? "pointer" : "not-allowed" }}
                disabled={tileCount !== 0}
                onClick={() => { setDeleteError(null); setDeleteConfirm(true); }}>
                {tileCount === null ? 'Checking tiles…' : tileCount === 0 ? '🗑 Delete tileset' : `Delete all tiles first (${tileCount} remaining)`}
              </button>
            </div>
          )}
          {deleteConfirm && canManage && (
            <TypeToConfirmModal
              title="Delete tileset"
              message="This tileset has no tiles left. This cannot be undone."
              expected={tsData.name}
              confirmLabel="Delete tileset"
              busy={deleteBusy}
              error={deleteError}
              onCancel={() => setDeleteConfirm(false)}
              onConfirm={doDeleteTileset} />
          )}
        </div>
      </div>
    </div>
  );
}

// ── Fit-to-viewport zoom ───────────────────────────────────────────────
function calcFitZoom(gw, gh) {
  const gridW = gw || GRID_W, gridH = gh || GRID_H;
  const w = window.innerWidth, h = window.innerHeight;
  const mobile = w < 768;
  // Mobile: only the 28px toggle strips are visible (sidebars collapsed)
  // Desktop: left 240 + right 260 + 2×28 strips = 556
  const sideW = mobile ? 56 : 556;
  const topH = 50;
  // Bottom bar: 3 rows × ~30px each ≈ 92px
  const botH = 92;
  const pad = 24;
  const availW = Math.max(1, w - sideW - pad);
  const availH = Math.max(1, h - topH - botH - pad);
  return Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, snapTo10(Math.min(availW / (gridW * CELL), availH / (gridH * CELL)))));
}

    const cur = parseFloat(multInput) || currentMult;
    const next = Math.max(0.1, Math.min(MAX_MULT_ARROW, Math.round((cur + delta) * 20) / 20));
    commitMult(String(next));
  };
  const commitOffset = (ox2, oy2) => {
    const ox = ox2 !== undefined ? ox2 : parseFloat(oxInput);
    const oy = oy2 !== undefined ? oy2 : parseFloat(oyInput);
    const newOff = { ox: isNaN(ox) ? 0 : ox, oy: isNaN(oy) ? 0 : oy };
    setTileOffsets(prev => ({ ...prev, [t.ref]: newOff }));
  };
  const stepOx = delta => {
    const cur = parseFloat(oxInput) || 0;
    const next = Math.round((cur + delta) * 100) / 100;
    setOxInput(String(next));
    commitOffset(next, parseFloat(oyInput) || 0);
  };
  const stepOy = delta => {
    const cur = parseFloat(oyInput) || 0;
    const next = Math.round((cur + delta) * 100) / 100;
    setOyInput(String(next));
    commitOffset(parseFloat(oxInput) || 0, next);
  };

  const fieldRow = (label, input, setInput, onBlur, extra) => (
    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
      <span style={{ fontSize: 11, color: C.muted, width: 100, flexShrink: 0 }}>{label}</span>
      <input type="number" value={input} onChange={e => setInput(e.target.value)}
        onBlur={onBlur} onKeyDown={e => { if (e.key === "Enter") e.target.blur(); }}
        style={{ width: 72, background: "rgba(180,40,40,0.09)", border: `1px solid ${C.border}`, borderRadius: 5, color: C.text, fontFamily: "monospace", fontSize: 12, padding: "4px 6px", outline: "none" }} />
      {extra}
    </div>
  );

  const [saveStatus, setSaveStatus] = React.useState(null); // null | 'saving' | 'ok' | 'err'
  const [replaceImgError, setReplaceImgError] = React.useState(null);
  const [replaceImgPending, setReplaceImgPending] = React.useState(null);
  // Shape: { file, tile, tilesetFolderPath, previewUrl } or null
  const [replaceImgUploading, setReplaceImgUploading] = React.useState(false);

  const cancelReplace = () => {
    if (replaceImgPending?.previewUrl) URL.revokeObjectURL(replaceImgPending.previewUrl);
    setReplaceImgPending(null);
    setReplaceImgError(null);
  };

  const confirmReplace = async () => {
    if (!replaceImgPending) return;
    const { file, tile, tilesetFolderPath, previewUrl } = replaceImgPending;
    setReplaceImgUploading(true);
    try {
      const token = await getValidToken();
      // Replace keeps the tile's existing path (including any sub-folder) and overwrites it.
      const filePath = repoPathFromUrl(tile.src);
      if (!filePath) throw new Error('This tile image is not hosted in the ophelia repo, so it cannot be replaced here.');
      const contentBase64 = await fileToBase64(file);
      await githubUpload(workerFetch, token, {
        filePath, contentBase64, overwrite: true,
        commitMessage: `[${currentUser.username}] Replace tile: ${filePath.slice('Resources/'.length)}`,
      });
      const newUrl = rawUrl(filePath);
      const patchResp = await workerFetch(`${WORKER_URL}/rest/v1/tiles?id=eq.${tile.dbId}`, {
        method: 'PATCH',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
        body: JSON.stringify({ image_url: newUrl }),
      });
      if (!patchResp.ok) throw new Error('DB patch failed');
      URL.revokeObjectURL(previewUrl);
      setReplaceImgPending(null);
      setTsFetchTrigger(n => n + 1);
      setInfoTile(null);
    } catch (err) {
      setReplaceImgError('Failed to replace image: ' + err.message);
    } finally {
      setReplaceImgUploading(false);
    }
  };

    const patchTile = async (body) => {
      const token = await getValidToken();
      const resp = await workerFetch(`${WORKER_URL}/rest/v1/tiles?id=eq.${t.dbId}`, {
        method: 'PATCH',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
        body: JSON.stringify(body),
      });
      if (resp.ok) {
        setDbTilesByTsId(prev => {
          const tsId = t.tilesetId;
          if (!prev[tsId]) return prev;
          return { ...prev, [tsId]: prev[tsId].map(row => row.id === t.dbId ? { ...row, ...body } : row) };
        });
      }
      return resp.ok;
    };

    const doSave = async () => {
      const savedScroll = modalScrollRef.current?.scrollTop ?? 0;
      setSaveStatus('saving');
      setRenameError(null);
      setRenameRecovery(null);
      let ok = false;
      try {
        const body = {
          size_multiplier: getTileMultiplier(t),
          offset_x: getTileOffset(t).ox,
          offset_y: getTileOffset(t).oy,
          rotatable: isTileRotatable(t),
          flippable: isFlipAllowed(t),
          mirror_offset: isMirrorOffset(t),
          bottom_render: isBottomTile(t),
          priority: isPriorityTile(t),
          auto_shadow: isAutoShadowTile(t),
          otg_passable: !isOTGWall(t),
          show_tile_count: !!t.dbShowTileCount,
          codename: codenameInput.trim() || t.codename,
          folder_key: folderKeyInput.trim() || null,
          sort_index: sortIndexInput !== '' ? parseInt(sortIndexInput, 10) : null,
          last_updated_at: new Date().toISOString(),
          last_updated_by: currentUser.id,
        };
        let moved = null;
        if (currentPath && fileNameInput !== currentFileName) {
          // Validate and refuse collisions before touching anything.
          const nameErr = checkFileName(fileNameInput);
          if (nameErr) throw Object.assign(new Error(`Image file name: ${nameErr}.`), { rename: true });
          const newPath = `${dirOf(currentPath)}/${fileNameInput}`;
          const others = takenRepoPaths(dbTilesByTsId[t.tilesetId], t.dbId);
          if (others.has(newPath.toLowerCase())) {
            throw Object.assign(new Error(`Another tile in this tileset already uses the file ${newPath}. Nothing was changed.`), { rename: true });
          }
          const token = await getValidToken();
          try {
            await githubMove(workerFetch, token, {
              moves: [{ from: currentPath, to: newPath }], deleteOld: true,
              commitMessage: `[${currentUser.username}] Rename tile file: ${currentPath.slice('Resources/'.length)} -> ${fileNameInput}`,
            });
          } catch (moveErr) {
            throw Object.assign(new Error(`Rename failed, nothing was changed: ${moveErr.message}`), { rename: true });
          }
          moved = { oldPath: currentPath, newPath };
          body.image_url = rawUrl(newPath);
        }
        try {
          ok = await patchTile(body);
        } catch { ok = false; }
        if (!ok && moved) setRenameRecovery({ ...moved, body });
      } catch (err) {
        if (err.rename) setRenameError(err.message);
        ok = false;
      }
      setSaveStatus(ok ? 'ok' : 'err');
      requestAnimationFrame(() => { if (modalScrollRef.current) modalScrollRef.current.scrollTop = savedScroll; });
      setTimeout(() => setSaveStatus(null), 3000);
    };

    const retryDbUpdate = async () => {
      if (!renameRecovery) return;
      setRecoveryBusy(true);
      let ok = false;
      try { ok = await patchTile(renameRecovery.body); } catch { ok = false; }
      setRecoveryBusy(false);
      if (ok) { setRenameRecovery(null); setSaveStatus('ok'); setTimeout(() => setSaveStatus(null), 3000); }
    };

  const doDeleteDbTile = async () => {
    setDeleteBusy(true);
    setDeleteError(null);
    try {
      const path = currentPath;
      // Never delete a file another loaded tile still points at.
      let sharedWith = null;
      if (path) {
        for (const rows of Object.values(dbTilesByTsId)) {
          for (const r of rows || []) {
            if (r.id !== t.dbId && repoPathFromUrl(r.image_url)?.toLowerCase() === path.toLowerCase()) sharedWith = r.codename ?? r.id;
          }
        }
      }
      const token = await getValidToken();
      const delResp = await workerFetch(`${WORKER_URL}/rest/v1/tiles?id=eq.${t.dbId}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
      });
      if (!delResp.ok) throw new Error((await workerErrorMessage(delResp, 'DB delete failed')).message);
      let note = null;
      if (path && sharedWith == null) {
        try {
          await workerJson(workerFetch, token, '/github/delete', { filePath: path, commitMessage: `[${currentUser.username}] Delete tile: ${path.slice('Resources/'.length)}` }, 'GitHub delete failed');
        } catch (ghErr) {
          note = `Tile deleted, but its file ${path} could not be removed from GitHub: ${ghErr.message}`;
        }
      } else if (path) {
        note = `Tile deleted. The file ${path} was kept because the tile "${sharedWith}" still uses it.`;
      } else {
        note = 'Tile deleted. Its image is hosted outside the ophelia repo, so no file was removed.';
      }
      setTsFetchTrigger(n => n + 1);
      setInfoTile(null);
      if (note) alert(note);
    } catch (err) {
      setDeleteError('Failed to delete tile: ' + err.message);
      setDeleteBusy(false);
    }
  };

  const FLAG_TIPS = {
    rotatable: "Tile can be rotated in 90° steps on the map.",
    flippable: "Tile can be flipped horizontally on the map.",
    otg_passable: "Tile is treated as a one-tile-gap passable object, rendered above the ground layer.",
    mirror_offset: "When the tile is flipped, its render offset is mirrored along the horizontal axis.",
    bottom_render: "Tile renders below the player/unit layer (e.g. floor details, shadows).",
    priority: "Tile renders above the player/unit layer (e.g. tall objects that overlap characters).",
    auto_shadow: "Tile automatically casts a drop-shadow onto the layer below.",
    show_tile_count: "Show a ×N badge on this tile card counting how many times it appears on the map.",
    size_multiplier: "Scales the tile's display size. 1.0 = normal, 1.5 = 50% larger, etc.",
    offset_h: "Shifts the tile horizontally (% of tile width). Positive = right.",
    offset_v: "Shifts the tile vertically (% of tile height). Positive = down.",
    starred: "Pin this tile to the starred shortcuts bar for instant access.",
  };
  // Inline ⓘ button — clicking toggles an inline description row that appears below the flag row
  const FlagTip = ({ id }) => (
    <button
      onClick={e => {
        e.stopPropagation();
        if (modalScrollRef.current) pendingScrollRef.current = modalScrollRef.current.scrollTop;
        setFlagTooltip(prev => prev === id ? null : id);
      }}
      style={{ background: "none", border: "none", cursor: "pointer", color: C.muted, fontSize: 10, padding: "0 2px", lineHeight: 1, opacity: 0.7 }}
      title="Info">ⓘ</button>
  );
  // Inline description row — rendered as a full-width grid item after the flag row
  const FlagDesc = ({ id }) => flagTooltip !== id ? null : (
    <div style={{ gridColumn: "1 / -1", padding: "4px 6px", background: "rgba(255,255,255,0.04)", borderRadius: 4, fontSize: 10, color: C.muted, lineHeight: 1.5, marginTop: -2 }}>
      {FLAG_TIPS[id]}
    </div>
  );
  // Issue 13: navigation follows panel order — flat tiles sorted by sortIndex, folder tiles within same folder only
  const navTiles = (() => {
    if (!t.tilesetName) {
      // User-uploaded tiles have no tilesetName — navigate across the uploaded section instead
      if (userTiles.some(u => u.ref === t.ref)) {
        return userTiles.slice().sort((a, b) => (a.uploadId ?? 0) - (b.uploadId ?? 0));
      }
      return [];
    }
    const tsFlatTiles = tiles.filter(tile => tile.tilesetName === t.tilesetName && !tile.folderKey);
    const tsFolderTiles = tiles.filter(tile => tile.tilesetName === t.tilesetName && tile.folderKey);
    const sortBySortIndex = arr => arr.slice().sort((a, b) => (a.sortIndex ?? 0) - (b.sortIndex ?? 0));
    if (t.folderKey) {
      return sortBySortIndex(tsFolderTiles.filter(tile => tile.folderKey === t.folderKey));
    } else {
      return sortBySortIndex(tsFlatTiles);
    }
  })();
  const navIdx = navTiles.findIndex(tile => tile.ref === t.ref);
  const hasPrev = navIdx > 0;
  const hasNext = navIdx < navTiles.length - 1;

  return (
    <div className="modal-backdrop" onClick={() => { setInfoTile(null); setDeleteConfirmId(null); }}>
      <div ref={modalScrollRef} className="modal-box" style={{ minWidth: 360, maxWidth: 500, maxHeight: '90vh', overflowY: 'auto' }} onClick={e => e.stopPropagation()}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <span style={{ fontSize: 13, fontWeight: 700, color: C.accentBright }}>Tile info</span>
          <button onClick={() => { setInfoTile(null); setDeleteConfirmId(null); }} style={{ background: "none", border: "none", cursor: "pointer", color: C.muted, fontSize: 18, lineHeight: 1 }}>×</button>
        </div>
        {navTiles.length > 1 ? (
          <div style={{ background: C.panelDeep, borderRadius: 8, padding: "12px 8px", display: "flex", alignItems: "center", justifyContent: "center", height: 160, gap: 8, flexShrink: 0 }}>
            <button disabled={!hasPrev} onClick={() => hasPrev && setInfoTile(navTiles[navIdx - 1].ref)}
              style={{ background: "none", border: `1px solid ${hasPrev ? C.border : "transparent"}`, borderRadius: 4, color: hasPrev ? C.text : C.muted, fontSize: 18, cursor: hasPrev ? "pointer" : "default", padding: "4px 8px", opacity: hasPrev ? 1 : 0.25, flexShrink: 0, lineHeight: 1 }}>‹</button>
            <div className="tile-img-checker" style={{ width: 120, height: 120, borderRadius: 4, overflow: "hidden", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
              <img src={t.blobSrc ?? t.src} alt="" style={{ width: "100%", height: "100%", objectFit: "contain", imageRendering: "pixelated" }} />
            </div>
            <button disabled={!hasNext} onClick={() => hasNext && setInfoTile(navTiles[navIdx + 1].ref)}
              style={{ background: "none", border: `1px solid ${hasNext ? C.border : "transparent"}`, borderRadius: 4, color: hasNext ? C.text : C.muted, fontSize: 18, cursor: hasNext ? "pointer" : "default", padding: "4px 8px", opacity: hasNext ? 1 : 0.25, flexShrink: 0, lineHeight: 1 }}>›</button>
          </div>
        ) : (
          <div style={{ background: C.panelDeep, borderRadius: 8, padding: 12, display: "flex", alignItems: "center", justifyContent: "center", height: 160, flexShrink: 0 }}>
            <div className="tile-img-checker" style={{ width: 128, height: 128, borderRadius: 4, overflow: "hidden", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <img src={t.blobSrc ?? t.src} alt="" style={{ width: "100%", height: "100%", objectFit: "contain", imageRendering: "pixelated" }} />
            </div>
          </div>
        )}

        {/* Starred shortcut */}
        <label style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer", userSelect: "none" }}>
          <input type="checkbox" checked={starredTiles.includes(t.ref)}
            onChange={() => toggleStar(t.ref)}
            style={{ width: 14, height: 14, accentColor: C.accent, cursor: "pointer" }} />
          <span style={{ fontSize: 11, color: C.text }}>Starred shortcut ⭐<FlagTip id="starred" /></span>
        </label>
        <FlagDesc id="starred" />

        {/* Codename — pre-filled from DB for DB tiles; editable for owners/admins */}
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ fontSize: 11, color: C.muted, width: 100, flexShrink: 0 }}>codename</span>
          <input value={codenameInput}
            readOnly={t.isDb && !canEditDb}
            onChange={e => { if (!t.isDb) setCodenameInput(e.target.value); else if (canEditDb) setCodenameInput(e.target.value); }}
            onBlur={() => {
              if (t.isDb) return;
              if (codenameInput === '') {
                setTileNames(prev => { const n = { ...prev }; delete n[t.ref]; return n; });
              } else {
                setTileNames(prev => ({ ...prev, [t.ref]: codenameInput }));
              }
            }}
            onKeyDown={e => { if (e.key === "Enter") e.target.blur(); }}
            placeholder={defaultCodename_ || "Enter codename…"}
            style={{ flex: 1, background: (t.isDb && !canEditDb) ? "transparent" : "rgba(180,40,40,0.09)", border: `1px solid ${C.border}`, borderRadius: 5, color: C.text, fontFamily: "monospace", fontSize: 12, padding: "4px 6px", outline: "none", cursor: (t.isDb && !canEditDb) ? "default" : "text" }} />
          {t.isDb && canEditDb && (() => { const dbVal = t.codename ?? ''; const isDefault = codenameInput === dbVal; const stl = isDefault ? { color: "#4ade80", borderColor: "#4ade80", background: "rgba(74,222,128,0.12)" } : { color: "#f97316", borderColor: "#f97316", background: "rgba(249,115,22,0.12)" }; return (
            <button style={{ ...btn(false), fontSize: 10, padding: "3px 7px", ...stl }} disabled={isDefault} title={isDefault ? "Already at DB value" : "Reset to DB value"} onClick={() => setCodenameInput(dbVal)}>Reset</button>
          ); })()}
        </div>

          {/* Image file name — DB tiles the user can edit; renamed on Save via /github/move */}
          {t.isDb && canEditDb && (
            <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontSize: 11, color: C.muted, width: 100, flexShrink: 0 }}>Image file name</span>
                <input value={fileNameInput}
                  disabled={!currentPath}
                  onChange={e => { setFileNameInput(e.target.value); setRenameError(null); }}
                  onKeyDown={e => { if (e.key === "Enter") e.target.blur(); }}
                  placeholder={currentPath ? "e.g. MyTile.png" : "external image"}
                  spellCheck={false}
                  style={{ flex: 1, background: "rgba(180,40,40,0.09)", border: `1px solid ${fileNameInput !== currentFileName ? "#f97316" : C.border}`, borderRadius: 5, color: C.text, fontFamily: "monospace", fontSize: 12, padding: "4px 6px", outline: "none" }} />
                {currentPath && (() => { const isDefault = fileNameInput === currentFileName; const stl = isDefault ? { color: "#4ade80", borderColor: "#4ade80", background: "rgba(74,222,128,0.12)" } : { color: "#f97316", borderColor: "#f97316", background: "rgba(249,115,22,0.12)" }; return (
                  <button style={{ ...btn(false), fontSize: 10, padding: "3px 7px", ...stl }} disabled={isDefault} title={isDefault ? "Already at DB value" : "Reset to DB value"} onClick={() => { setFileNameInput(currentFileName); setRenameError(null); }}>Reset</button>
                ); })()}
              </div>
              {currentPath ? (
                <div style={{ display: "flex", gap: 6, marginLeft: 108, flexWrap: "wrap" }}>
                  <button style={{ ...btn(false), fontSize: 10, padding: "3px 7px" }}
                    disabled={!codenameInput.trim()}
                    onClick={() => { setFileNameInput(defaultFileName({ codename: codenameInput.trim(), ext: fileExtOf(currentFileName) })); setRenameError(null); }}>Use codename</button>
                  {dbRow?.sensor_code && (
                    <button style={{ ...btn(false), fontSize: 10, padding: "3px 7px" }}
                      disabled={!folderKeyInput.trim()}
                      onClick={() => { setFileNameInput(defaultFileName({ sensor: true, folderKey: folderKeyInput.trim(), sensorCode: dbRow.sensor_code })); setRenameError(null); }}>Use codename + sensor code</button>
                  )}
                </div>
              ) : (
                <span style={{ fontSize: 10, color: C.muted, marginLeft: 108 }}>This image is hosted outside the ophelia repo and cannot be renamed here.</span>
              )}
              {fileNameInput !== currentFileName && currentPath && (
                <span style={{ fontSize: 10, color: C.muted, marginLeft: 108 }}>The file is renamed on GitHub when you press Save.</span>
              )}
              {renameError && <span style={{ fontSize: 11, color: C.danger, marginLeft: 108 }}>{renameError}</span>}
            </div>
          )}

        {/* folder_key — only shown for DB tiles */}
        {t.isDb && (
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ fontSize: 11, color: C.muted, width: 100, flexShrink: 0 }}>folder_key</span>
            <input value={folderKeyInput}
              readOnly={!canEditDb}
              onChange={e => { if (canEditDb) setFolderKeyInput(e.target.value); }}
              onKeyDown={e => { if (e.key === "Enter") e.target.blur(); }}
              placeholder="e.g. Walls"
              style={{ flex: 1, background: !canEditDb ? "transparent" : "rgba(180,40,40,0.09)", border: `1px solid ${C.border}`, borderRadius: 5, color: C.text, fontFamily: "monospace", fontSize: 12, padding: "4px 6px", outline: "none", cursor: !canEditDb ? "default" : "text" }} />
            {canEditDb && (() => { const dbVal = t.folderLabel ?? ''; const isDefault = folderKeyInput === dbVal; const stl = isDefault ? { color: "#4ade80", borderColor: "#4ade80", background: "rgba(74,222,128,0.12)" } : { color: "#f97316", borderColor: "#f97316", background: "rgba(249,115,22,0.12)" }; return (
              <button style={{ ...btn(false), fontSize: 10, padding: "3px 7px", ...stl }} disabled={isDefault} title={isDefault ? "Already at DB value" : "Reset to DB value"} onClick={() => setFolderKeyInput(dbVal)}>Reset</button>
            ); })()}
          </div>
        )}
        {/* sort_index — only shown for DB tiles, editable by owners/admins */}
        {t.isDb && (
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ fontSize: 11, color: C.muted, width: 100, flexShrink: 0 }}>sort_index</span>
            <input type="number" value={sortIndexInput}
              readOnly={!canEditDb}
              onChange={e => { if (canEditDb) setSortIndexInput(e.target.value); }}
              onKeyDown={e => { if (e.key === "Enter") e.target.blur(); }}
              placeholder="0"
              style={{ width: 72, background: !canEditDb ? "transparent" : "rgba(180,40,40,0.09)", border: `1px solid ${C.border}`, borderRadius: 5, color: C.text, fontFamily: "monospace", fontSize: 12, padding: "4px 6px", outline: "none", cursor: !canEditDb ? "default" : "text" }} />
            {canEditDb && (() => { const dbVal = t.sortIndex != null ? String(t.sortIndex) : ''; const isDefault = sortIndexInput === dbVal; const stl = isDefault ? { color: "#4ade80", borderColor: "#4ade80", background: "rgba(74,222,128,0.12)" } : { color: "#f97316", borderColor: "#f97316", background: "rgba(249,115,22,0.12)" }; return (
              <button style={{ ...btn(false), fontSize: 10, padding: "3px 7px", ...stl }} disabled={isDefault} title={isDefault ? "Already at DB value" : "Reset to DB value"} onClick={() => setSortIndexInput(dbVal)}>Reset</button>
            ); })()}
          </div>
        )}

        {/* Size multiplier */}
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ fontSize: 11, color: C.muted, width: 100, flexShrink: 0 }}>Size multiplier (%)<FlagTip id="size_multiplier" /></span>
          <button style={{ ...btn(false), padding: "3px 8px", fontSize: 14, lineHeight: 1 }} onClick={() => stepMult(-0.05)}>−</button>
          <input type="number" value={multInput} step="0.05"
            onChange={e => setMultInput(e.target.value)}
            onBlur={() => commitMult()}
            onKeyDown={e => { if (e.key === "Enter") e.target.blur(); }}
            style={{ width: 62, background: "rgba(180,40,40,0.09)", border: `1px solid ${C.border}`, borderRadius: 5, color: C.text, fontFamily: "monospace", fontSize: 12, padding: "4px 6px", outline: "none", textAlign: "center" }} />
          <button style={{ ...btn(false), padding: "3px 8px", fontSize: 14, lineHeight: 1 }} onClick={() => stepMult(+0.05)}>+</button>
          {(() => { const isDefault = currentMult === defaultMult; const stl = isDefault ? { color: "#4ade80", borderColor: "#4ade80", background: "rgba(74,222,128,0.12)" } : { color: "#f97316", borderColor: "#f97316", background: "rgba(249,115,22,0.12)" }; return (
            <button style={{ ...btn(false), fontSize: 10, padding: "3px 7px", marginLeft: "auto", ...stl }}
              disabled={isDefault} title={isDefault ? "Already at default" : "Reset to default"}
              onClick={() => { setTileMultipliers(prev => { const n = {...prev}; delete n[t.ref]; return n; }); setMultInput(String(defaultMult)); }}>Reset</button>
          ); })()}
        </div>

        <FlagDesc id="size_multiplier" />

        {/* Offsets */}
        <span style={{ fontSize: 11, color: C.muted, fontWeight: 600 }}>Offsets (%) 📐</span>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ fontSize: 11, color: C.muted, width: 100, flexShrink: 0 }}>Horizontal<FlagTip id="offset_h" /></span>
          <button style={{ ...btn(false), padding: "3px 8px", fontSize: 14, lineHeight: 1 }} onClick={() => stepOx(-1)}>−</button>
          <input type="number" value={oxInput} onChange={e => setOxInput(e.target.value)}
            onBlur={() => commitOffset()} onKeyDown={e => { if (e.key === "Enter") e.target.blur(); }}
            style={{ width: 62, background: "rgba(180,40,40,0.09)", border: `1px solid ${C.border}`, borderRadius: 5, color: C.text, fontFamily: "monospace", fontSize: 12, padding: "4px 6px", outline: "none", textAlign: "center" }} />
          <button style={{ ...btn(false), padding: "3px 8px", fontSize: 14, lineHeight: 1 }} onClick={() => stepOx(+1)}>+</button>
          {(() => { const isDefault = currentOff.ox === defaultOff.ox; const stl = isDefault ? { color: "#4ade80", borderColor: "#4ade80", background: "rgba(74,222,128,0.12)" } : { color: "#f97316", borderColor: "#f97316", background: "rgba(249,115,22,0.12)" }; return (
            <button style={{ ...btn(false), fontSize: 10, padding: "3px 7px", marginLeft: "auto", ...stl }}
              disabled={isDefault} title={isDefault ? "Already at default" : "Reset to default"}
              onClick={() => { setOxInput(String(defaultOff.ox)); setTileOffsets(prev => { const n = {...prev}; const o = {...(prev[t.ref] ?? {}), ox: defaultOff.ox}; n[t.ref] = o; return n; }); }}>Reset</button>
          ); })()}
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ fontSize: 11, color: C.muted, width: 100, flexShrink: 0 }}>Vertical<FlagTip id="offset_v" /></span>
          <button style={{ ...btn(false), padding: "3px 8px", fontSize: 14, lineHeight: 1 }} onClick={() => stepOy(-1)}>−</button>
          <input type="number" value={oyInput} onChange={e => setOyInput(e.target.value)}
            onBlur={() => commitOffset()} onKeyDown={e => { if (e.key === "Enter") e.target.blur(); }}
            style={{ width: 62, background: "rgba(180,40,40,0.09)", border: `1px solid ${C.border}`, borderRadius: 5, color: C.text, fontFamily: "monospace", fontSize: 12, padding: "4px 6px", outline: "none", textAlign: "center" }} />
          <button style={{ ...btn(false), padding: "3px 8px", fontSize: 14, lineHeight: 1 }} onClick={() => stepOy(+1)}>+</button>
          {(() => { const isDefault = currentOff.oy === defaultOff.oy; const stl = isDefault ? { color: "#4ade80", borderColor: "#4ade80", background: "rgba(74,222,128,0.12)" } : { color: "#f97316", borderColor: "#f97316", background: "rgba(249,115,22,0.12)" }; return (
            <button style={{ ...btn(false), fontSize: 10, padding: "3px 7px", marginLeft: "auto", ...stl }}
              disabled={isDefault} title={isDefault ? "Already at default" : "Reset to default"}
              onClick={() => { setOyInput(String(defaultOff.oy)); setTileOffsets(prev => { const n = {...prev}; const o = {...(prev[t.ref] ?? {}), oy: defaultOff.oy}; n[t.ref] = o; return n; }); }}>Reset</button>
          ); })()}
        </div>
        {(flagTooltip === 'offset_h' || flagTooltip === 'offset_v') && (
          <div style={{ padding: "4px 6px", background: "rgba(255,255,255,0.04)", borderRadius: 4, fontSize: 10, color: C.muted, lineHeight: 1.5 }}>{FLAG_TIPS[flagTooltip]}</div>
        )}

        {/* Boolean flags — 2-column grid.
             Each pair of flag labels occupies one row; the inline tooltip description
             is placed as the NEXT grid item with gridColumn:"1/-1" so it spans both
             columns correctly. Using React.Fragment caused descriptions to land in col 2
             instead of spanning the full row — this explicit pairing fixes that. */}
        {(() => {
          const curSpin = isTileRotatable(t);
          const spinColor = (curSpin === isDefaultRotatable(t)) ? "#4ade80" : "#f97316";
          const curFlip = isFlipAllowed(t);
          const flipColor = (curFlip === isDefaultFlippable(t)) ? "#4ade80" : "#f97316";
          const curPassable = !isOTGWall(t);
          const defaultPassable = !isDefaultOTGWall(t);
          const otgColor = (otgWallOverrides[t.ref] === undefined) ? "#4ade80" : "#f97316";
          const mirrorOn = isMirrorOffset(t);
          const moColor = (mirrorOn === isDefaultMirrorOffset(t)) ? "#4ade80" : "#f97316";
          const botOn = isBottomTile(t);
          const bottomDef = defaultBottomTile(t);
          const botColor = (botOn === bottomDef) ? "#4ade80" : "#f97316";
          const topDef = defaultPriorityTile(t);
          const topColor = (isPriority === topDef) ? "#4ade80" : "#f97316";
          const shadowOn = isAutoShadowTile(t);
          const shadowDef = defaultAutoShadowTile(t);
          const shadowColor = (shadowOn === shadowDef) ? "#4ade80" : "#f97316";
          const countOn = !!t.dbShowTileCount;
          const putBool = (setter, val, def) => setter(prev => { const n = { ...prev }; if (val === def) delete n[t.ref]; else n[t.ref] = val; return n; });
          const ft = flagTooltip;
          const ls = { display: "flex", alignItems: "center", gap: 5, cursor: "pointer", userSelect: "none" };
          const cs = col => ({ width: 13, height: 13, flexShrink: 0, accentColor: col, cursor: "pointer" });
          const ds = { gridColumn: "1 / -1", padding: "4px 6px", background: "rgba(255,255,255,0.04)", borderRadius: 4, fontSize: 10, color: C.muted, lineHeight: 1.5, marginTop: -2 };
          return (
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "4px 6px" }}>
              {/* Row 1 — rotatable | flippable */}
              <label style={ls}>
                <input type="checkbox" checked={curSpin} style={cs(spinColor)}
                  onChange={ev => {
                    putBool(setRotatableMap, ev.target.checked, isDefaultRotatable(t));
                    if (!ev.target.checked) {
                      setCardRotations(prev => { const n = {...prev}; delete n[t.ref]; return n; });
                      if (!isFlipAllowed(t)) {
                        setCardFlipSteps(prev => { const n = {...prev}; delete n[t.ref]; return n; });
                        setCardFlipModes(prev => { const n = {...prev}; delete n[t.ref]; return n; });
                      }
                    }
                  }} />
                <span style={{ fontSize: 10, color: spinColor, fontFamily: "monospace" }}>rotatable 🐬</span><FlagTip id="rotatable" />
              </label>
              <label style={ls}>
                <input type="checkbox" checked={curFlip} style={cs(flipColor)}
                  onChange={ev => {
                    putBool(setAllowFlipMap, ev.target.checked, isDefaultFlippable(t));
                    if (!ev.target.checked) {
                      setCardFlipSteps(prev => { const n = {...prev}; delete n[t.ref]; return n; });
                      if ((cardFlipModes[t.ref] ?? 'flip') === 'flip') { setCardFlipModes(prev => { const n = {...prev}; delete n[t.ref]; return n; }); }
                    }
                  }} />
                <span style={{ fontSize: 10, color: flipColor, fontFamily: "monospace" }}>flippable 🦭</span><FlagTip id="flippable" />
              </label>
              {(ft === 'rotatable' || ft === 'flippable') && <div style={ds}>{FLAG_TIPS[ft]}</div>}

              {/* Row 2 — otg_passable | mirror_offset */}
              <label style={ls}>
                <input type="checkbox" checked={curPassable} style={cs(otgColor)}
                  onChange={ev => setOtgWallOverrides(prev => {
                    const n = { ...prev };
                    if (ev.target.checked === defaultPassable) delete n[t.ref]; else n[t.ref] = !ev.target.checked;
                    return n;
                  })} />
                <span style={{ fontSize: 10, color: otgColor, fontFamily: "monospace" }}>otg_passable 👟</span><FlagTip id="otg_passable" />
              </label>
              <label style={ls}>
                <input type="checkbox" checked={mirrorOn} style={cs(moColor)}
                  onChange={ev => putBool(setMirrorOffsetTiles, ev.target.checked, isDefaultMirrorOffset(t))} />
                <span style={{ fontSize: 10, color: moColor, fontFamily: "monospace" }}>mirror_offset 🌪️</span><FlagTip id="mirror_offset" />
              </label>
              {(ft === 'otg_passable' || ft === 'mirror_offset') && <div style={ds}>{FLAG_TIPS[ft]}</div>}

              {/* Row 3 — bottom_render | priority */}
              <label style={ls}>
                <input type="checkbox" checked={botOn} style={cs(botColor)}
                  onChange={ev => {
                    putBool(setBottomTiles, ev.target.checked, bottomDef);
                    if (ev.target.checked && isPriority) putBool(setPriorityTiles, false, topDef);
                  }} />
                <span style={{ fontSize: 10, color: botColor, fontFamily: "monospace" }}>bottom_render ⚓</span><FlagTip id="bottom_render" />
              </label>
              <label style={ls}>
                <input type="checkbox" checked={isPriority} style={cs(topColor)}
                  onChange={ev => {
                    putBool(setPriorityTiles, ev.target.checked, topDef);
                    if (ev.target.checked && botOn) putBool(setBottomTiles, false, bottomDef);
                  }} />
                <span style={{ fontSize: 10, color: topColor, fontFamily: "monospace" }}>priority 🚨</span><FlagTip id="priority" />
              </label>
              {(ft === 'bottom_render' || ft === 'priority') && <div style={ds}>{FLAG_TIPS[ft]}</div>}

              {/* Row 4 — auto_shadow | show_tile_count (DB tiles only) */}
              <label style={ls}>
                <input type="checkbox" checked={shadowOn} style={cs(shadowColor)}
                  onChange={ev => putBool(setAutoShadowTiles, ev.target.checked, shadowDef)} />
                <span style={{ fontSize: 10, color: shadowColor, fontFamily: "monospace" }}>auto_shadow 👻</span><FlagTip id="auto_shadow" />
              </label>
              {t.isDb ? (
                <label style={{ ...ls, cursor: canEditDb ? "pointer" : "default" }}>
                  <input type="checkbox" checked={countOn} disabled={!canEditDb}
                    style={{ width: 13, height: 13, flexShrink: 0, accentColor: "#34d399", cursor: canEditDb ? "pointer" : "default" }}
                    onChange={ev => {
                      const checked = ev.target.checked;
                      setTimeout(() => {
                        setDbTilesByTsId(prev => {
                          const tsId = t.tilesetId;
                          if (!prev[tsId]) return prev;
                          return { ...prev, [tsId]: prev[tsId].map(row => row.id === t.dbId ? { ...row, show_tile_count: checked } : row) };
                        });
                      }, 0);
                    }} />
                  <span style={{ fontSize: 10, color: "#34d399", fontFamily: "monospace" }}>show_tile_count 🧮</span><FlagTip id="show_tile_count" />
                </label>
              ) : <div />}
              {(ft === 'auto_shadow' || ft === 'show_tile_count') && <div style={ds}>{FLAG_TIPS[ft]}</div>}
            </div>
          );
        })()}

        {/* Save to Database — visible to admins and the tileset owner */}
        {canEditDb && (
          <button
            disabled={saveStatus === 'saving'}
            onClick={doSave}
            style={{ ...btn(true, saveStatus === 'err' ? C.danger : '#4ade80', saveStatus === 'err' ? 'rgba(248,113,113,0.15)' : 'rgba(74,222,128,0.15)'), width: '100%', justifyContent: 'center', fontSize: 11 }}>
            {saveStatus === 'saving' ? 'Saving…' : saveStatus === 'ok' ? '✓ Saved to Database' : saveStatus === 'err' ? '✗ Save failed' : '💾 Save to Database'}
          </button>
        )}
          {renameRecovery && (
            <div style={{ display: "flex", flexDirection: "column", gap: 6, padding: "8px 10px", border: `1px solid ${C.danger}`, borderRadius: 6, background: "rgba(248,113,113,0.08)" }}>
              <span style={{ fontSize: 11, color: C.danger, fontWeight: 700 }}>The file was renamed on GitHub but the database update failed.</span>
              <span style={{ fontSize: 10, color: C.text, wordBreak: "break-all" }}>Old path (no longer exists): <code>{renameRecovery.oldPath}</code></span>
              <span style={{ fontSize: 10, color: C.text, wordBreak: "break-all" }}>New path (the file is here): <code>{renameRecovery.newPath}</code></span>
              <span style={{ fontSize: 10, color: C.muted }}>This tile still points at the old path until the database is updated.</span>
              <button disabled={recoveryBusy} onClick={retryDbUpdate}
                style={{ ...btn(true, C.danger, "rgba(248,113,113,0.18)"), justifyContent: "center", fontSize: 11 }}>{recoveryBusy ? 'Retrying…' : 'Retry DB update'}</button>
            </div>
          )}

        {/* Replace image (owned DB tiles) */}
        {t.isDb && currentUser && (userProfile?.role === 'admin' || t.tilesetOwnerId === currentUser.id) && (
          <>
            <input type="file" accept="image/*" id="replace-img-input" style={{ display: "none" }}
              onChange={e => {
                const file = e.target.files?.[0];
                if (!file) return;
                setReplaceImgError(null);
                if (!file.type.startsWith('image/')) {
                  setReplaceImgError('File must be an image.');
                  e.target.value = '';
                  return;
                }
                if (file.size > 10000000) {
                  setReplaceImgError('File exceeds the 10 MB size limit.');
                  e.target.value = '';
                  return;
                }
                const tilesetFolderPath = dbTilesets.find(ts => ts.id === t.tilesetId)?.folder_path;
                if (!tilesetFolderPath) {
                  setReplaceImgError('This tileset has no GitHub folder path configured.');
                  e.target.value = '';
                  return;
                }
                const previewUrl = URL.createObjectURL(file);
                setReplaceImgPending({ file, tile: t, tilesetFolderPath, previewUrl });
                e.target.value = '';
              }} />
            {replaceImgPending && (
              <div style={{ position: 'fixed', inset: 0, zIndex: 9999, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'rgba(0,0,0,0.6)' }}>
                <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 10, padding: '20px 24px', minWidth: 280, maxWidth: 380, display: 'flex', flexDirection: 'column', gap: 14 }}>
                  <span style={{ fontWeight: 700, fontSize: 14, color: C.accentBright }}>Replace Image</span>
                  <div style={{ display: 'flex', gap: 12 }}>
                    {[{ label: 'Current', src: replaceImgPending.tile.src }, { label: 'New', src: replaceImgPending.previewUrl }].map(({ label, src }) => (
                      <div key={label} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4 }}>
                        <span style={{ fontSize: 10, color: C.muted }}>{label}</span>
                        <div className="tile-img-checker" style={{ width: 32, height: 32 }}>
                          <img src={src} style={{ width: 32, height: 32, imageRendering: 'pixelated', display: 'block' }} />
                        </div>
                      </div>
                    ))}
                  </div>
                  <span style={{ fontSize: 10, color: C.muted }}>
                    {`Replacing: ${repoPathFromUrl(replaceImgPending.tile.src) ?? replaceImgPending.tile.src.split('?')[0].split('/').pop()}`}
                  </span>
                  {replaceImgError && <span style={{ fontSize: 11, color: C.danger }}>{replaceImgError}</span>}
                  <div style={{ display: 'flex', gap: 8 }}>
                    <button disabled={replaceImgUploading} onClick={cancelReplace} style={{ ...btn(false), flex: 1, fontSize: 11 }}>Cancel</button>
                    <button disabled={replaceImgUploading} onClick={confirmReplace} style={{ ...btn(true, '#fbbf24', 'rgba(251,191,36,0.15)'), flex: 1, fontSize: 11 }}>
                      {replaceImgUploading ? 'Uploading…' : 'Confirm Replace'}
                    </button>
                  </div>
                </div>
              </div>
            )}
            {replaceImgError && !replaceImgPending && <span style={{ fontSize: 11, color: C.danger }}>{replaceImgError}</span>}
            <button onClick={() => { const s = modalScrollRef.current?.scrollTop ?? 0; setReplaceImgError(null); document.getElementById('replace-img-input').click(); requestAnimationFrame(() => { if (modalScrollRef.current) modalScrollRef.current.scrollTop = s; }); }}
              style={{ ...btn(true, '#fbbf24', 'rgba(251,191,36,0.15)'), width: '100%', justifyContent: 'center', fontSize: 11 }}>
              🖼 Replace Image
            </button>
          </>
        )}

        {/* Delete — DB tiles; owners and admins only (canEditDb is false for unowned tilesets unless admin) */}
        {t.isDb && canEditDb ? (
          <>
            <button style={{ ...btn(true, C.danger, "rgba(248,113,113,0.15)"), width: "100%", justifyContent: "center", fontSize: 11 }}
              onClick={() => { setDeleteError(null); setDeleteModalOpen(true); }}>🗑 Delete from Database</button>
            {deleteModalOpen && (
              <TypeToConfirmModal
                title="Delete tile"
                message="This removes the tile from the database and deletes its image file from GitHub unless another tile uses the same file."
                expected={t.codename ?? ''}
                confirmLabel="Delete tile"
                busy={deleteBusy}
                error={deleteError}
                onCancel={() => setDeleteModalOpen(false)}
                onConfirm={doDeleteDbTile} />
            )}
          </>
        ) : !t.isDefault && !t.isDb ? (
          deleteConfirmId === t.ref ? (() => {
            const codenameToConfirm = tileNames[t.ref] || defaultCodename_ || String(t.uploadId ?? t.codename ?? '');
            return (
              <div style={{ display: "flex", flexDirection: "column", gap: 5, padding: "6px 0" }}>
                <span style={{ fontSize: 11, color: C.danger, textAlign: "center" }}>Type <code style={{ background: "rgba(248,113,113,0.12)", padding: "1px 4px", borderRadius: 3 }}>{codenameToConfirm}</code> to confirm deletion</span>
                <input
                  value={deleteConfirmInput}
                  onChange={e => setDeleteConfirmInput(e.target.value)}
                  onKeyDown={e => { if (e.key === 'Escape') { setDeleteConfirmId(null); setDeleteConfirmInput(''); } }}
                  placeholder={codenameToConfirm}
                  autoFocus
                  style={{ background: "rgba(180,40,40,0.09)", border: `1px solid ${C.border}`, borderRadius: 5, color: C.text, fontFamily: "monospace", fontSize: 11, padding: "4px 6px", outline: "none" }} />
                <div style={{ display: "flex", gap: 6 }}>
                  <button style={{ ...btn(false), flex: 1, fontSize: 11 }} onClick={() => { setDeleteConfirmId(null); setDeleteConfirmInput(''); }}>Cancel</button>
                  <button style={{ ...btn(true, C.danger, "rgba(248,113,113,0.18)"), flex: 1, fontSize: 11 }}
                    disabled={deleteConfirmInput !== codenameToConfirm}
                    onClick={() => { setDeleteConfirmId(null); setDeleteConfirmInput(''); deleteTile(t.ref); }}>Delete</button>
                </div>
              </div>
            );
          })() : (
            <button style={{ ...btn(false, C.danger, "rgba(248,113,113,0.14)"), width: "100%", justifyContent: "center" }}
              onClick={() => { const s = modalScrollRef.current?.scrollTop ?? 0; setDeleteConfirmId(t.ref); setDeleteConfirmInput(''); requestAnimationFrame(() => { if (modalScrollRef.current) modalScrollRef.current.scrollTop = s; }); }}>Delete tile</button>
          )
        ) : t.isDefault ? (
          <p style={{ fontSize: 11, color: C.muted, textAlign: "center" }}>Default tile — cannot be deleted.</p>
        ) : null}
      </div>
    </div>
  );
}

// ── Sensor folder components (top level: not nested in App, so their state survives App re-renders) ──
const SENSOR_YELLOW = "#f5c518";
const STATUS_COLORS = { explicit: "#34d399", derived: "#60a5fa", composed: "#c084fc", missing: "#f87171" };
const sensorBtnStyle = (color = C.accent) => ({ background: "rgba(255,255,255,0.04)", border: `1px solid ${color}`, borderRadius: 6, color, cursor: "pointer", fontSize: 11, padding: "3px 10px", fontFamily: "'Inter', sans-serif" });
const tileUrl = t => (t ? (t.blobSrc ?? t.src) : null);
const fromLabel = e => (e.derivedFrom ? `from ${e.derivedFrom.tile.codename ?? e.derivedFrom.code} (${SensorUI.opsLabel(e.ops)})` : null);

// The image for a resolver result / pool entry: derived variants are the source image with CSS spin/flip; composed ones are a
// canvas image (falling back to the folder's explicit 00000000 variant while pending or when composing fails).
function sensorEntryVisual(entry, code, status, recipe, folderRef, candidates, requestComposed) {
  if (status === "composed") {
    const url = requestComposed(folderRef, code, recipe);
    if (url && url !== "fail") return { src: url, css: "", state: "composed" };
    const fb = candidates["00000000"];
    const fbTile = fb && fb.status === "explicit" ? fb.pool[0].tile : null;
    return { src: tileUrl(fbTile), css: "", state: url === "fail" ? "failed" : "pending" };
  }
  return { src: tileUrl(entry.tile), css: SensorUI.opsToCss(entry.ops), state: "ok" };
}

function SensorWarningModal({ folder, onClose }) {

    <div className="modal-backdrop" onClick={onClose}>

          <span style={{ fontSize: 13, fontWeight: 700, color: SENSOR_YELLOW }}>⚠ {folder.label}: settings differ</span>
          <button onClick={onClose} style={{ background: "none", border: "none", cursor: "pointer", color: C.muted, fontSize: 18, lineHeight: 1 }}>×</button>
        </div>
        {folder.warnings.length > 0 && (
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            <span style={{ fontSize: 11, color: C.muted }}>These settings are shared by the whole folder, but the variants disagree. The first variant is used.</span>

        {folder.unlabelled.length > 0 && (
          <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
            <b style={{ fontSize: 12, color: C.text }}>Tiles without a sensor code (never auto-placed)</b>
            <span style={{ fontSize: 11, color: C.muted }}>Open a tile's info and give it a sensor code to use it.</span>
            {folder.unlabelled.map(t => <div key={t.ref} style={{ fontSize: 11, color: C.muted, marginLeft: 8 }}>{t.codename ?? t.ref}</div>)}
          </div>
        )}
        <button style={sensorBtnStyle()} onClick={onClose}>OK</button>
      </div>
    </div>
  );
}

// Simulator: 3x3 grid, centre fixed, eight neighbours toggleable. Shows what sensor.resolve() returns. Edits nothing.
function SensorSimulationPanel({ folder, candidates, requestComposed, onClose }) {
  const [bits, setBits] = useState(() => Array(8).fill(false));
  const [seed, setSeed] = useState(0);
  const engine = useMemo(() => SensorUI.engineFolder(folder), [folder]);
  const code = bits.map(b => (b ? "1" : "0")).join("");
  const res = SensorEngine.resolve(engine, code, { x: seed, y: seed * 7 + 1, salt: folder.ref, candidates });
  const cov = useMemo(() => SensorEngine.coverage(engine), [engine]);
  const required = useMemo(() => SensorEngine.computeRequiredBase(engine), [engine]);
  const pool = res ? candidates[res.code].pool : [];
  const pct = SensorEngine.pickPercentages(pool);
  const vis = res ? sensorEntryVisual(res.entry, res.code, res.status, res.recipe, folder.ref, candidates, requestComposed) : null;
  const cellBox = { width: 44, height: 44, borderRadius: 6, boxSizing: "border-box" };
  const setFromCode = c => { setBits(c.split("").map(ch => ch === "1")); };
  const order = [0, 1, 2, 3, null, 4, 5, 6, 7];
  return (
    <div className="modal-backdrop" onClick={onClose} style={{ zIndex: 3000 }}>
      <div className="modal-box" onClick={e => e.stopPropagation()} style={{ maxWidth: 560, maxHeight: "90vh", overflowY: "auto", gap: 12 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <span style={{ fontSize: 13, fontWeight: 700, color: SENSOR_YELLOW }}>✨ Sensor folder simulation: {folder.label}</span>
          <button onClick={onClose} style={{ background: "none", border: "none", cursor: "pointer", color: C.muted, fontSize: 18, lineHeight: 1 }}>×</button>
        </div>
        <span style={{ fontSize: 11, color: C.muted }}>Simulator - toggle neighbours to see which variant appears. This does not edit anything.</span>
        <div style={{ display: "flex", gap: 16, flexWrap: "wrap", alignItems: "flex-start" }}>

            ))}
          </div>
          <div data-testid="sim-required" style={{ fontSize: 11, color: required.length ? C.danger : C.muted }}>
            {!folder.settings.spin ? "Spin is off: no composed variants. Every code you want must be an explicit tile (or flip-derived)."
              : required.length ? `Base codes still required for composition: ${required.join(", ")}` : "All four base codes exist: missing codes can be composed."}
          </div>
        </div>
        <button style={sensorBtnStyle()} onClick={onClose}>Close</button>
      </div>
    </div>
  );
}

function App() {
  const savedColors = load(SK.colors, { bg1: DEFAULT_BG1, bg2: DEFAULT_BG2 });
  const mobile = isMobileDevice();

  // Default tiles loaded dynamically from Resources/manifest.json
  const [defaultTiles, setDefaultTiles]   = useState([]);
  const [tilesLoading, setTilesLoading]   = useState(true);

  // User-uploaded tiles persisted in localStorage as { id: n, src }; at runtime each is { ref: "u:<n>", uploadId: n, src }.
