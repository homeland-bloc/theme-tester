  const [userTiles, setUserTiles] = useState(() => {
    const saved = load(SK.userTiles, []);
    return saved.filter(t => t && t.id != null).map(({ id, ...t }) => ({ ...t, uploadId: id, ref: makeRef("u", id), blobSrc: t.src ? dataURLtoBlobURL(t.src) : undefined }));
  });
  // DB tilesets and tiles (fetched from Supabase on mount)
  const [dbTilesets, setDbTilesets] = useState([]);
  const [dbTilesByTsId, setDbTilesByTsId] = useState({}); // tiles keyed by tileset UUID, loaded on demand
  const dbTilesByTsIdRef = useRef({}); // always-current ref for cache checks inside async closures

  // Auth: Discord login via OAuth + Firebase custom tokens
  const [currentUser, setCurrentUser] = useState(() => { try { return JSON.parse(localStorage.getItem('oph_user')); } catch { return null; } });
  const [authChecked, setAuthChecked] = useState(false); // true once Firebase auth state has been checked
  const [userProfile, setUserProfile] = useState(null); // { role, ... } fetched from Supabase
  const [userDropOpen, setUserDropOpen] = useState(false);
  const [logoutConfirming, setLogoutConfirming] = useState(false);
  const [adminOpen, setAdminOpen] = useState(false);
  const [adminProfiles, setAdminProfiles] = useState([]);
  const [adminLoading, setAdminLoading] = useState(false);
  const [adminRoleChanging, setAdminRoleChanging] = useState(new Set()); // profile IDs currently being patched
  // Tileset/tile management (Tasks 6d, 6e, 6f)
  const [createTsOpen, setCreateTsOpen] = useState(false);
  const [createTsName, setCreateTsName] = useState('');
  const [createTsFolderPath, setCreateTsFolderPath] = useState('');
  const [createTsFile, setCreateTsFile] = useState(null);
  const [createTsCodename, setCreateTsCodename] = useState('');
  const [createTsFolderKey, setCreateTsFolderKey] = useState('');
  const [createTsSortIdx, setCreateTsSortIdx] = useState('');
  const [createTsLoading, setCreateTsLoading] = useState(false);
  const [addTileOpen, setAddTileOpen] = useState(false);
  const [addTileTsId, setAddTileTsId] = useState(null);
  const [addTileFile, setAddTileFile] = useState(null);
  const [addTileCodename, setAddTileCodename] = useState('');
  const [addTileFolderKey, setAddTileFolderKey] = useState('');
  const [addTileSortIdx, setAddTileSortIdx] = useState('');
  const [addTileLoading, setAddTileLoading] = useState(false);
  const [addTileError, setAddTileError] = useState('');
  const [tsFetchTrigger, setTsFetchTrigger] = useState(0);
  const [tsGearOpen, setTsGearOpen] = useState(false);
  const [tsGearTsId, setTsGearTsId] = useState(null);
  const [tsGearName, setTsGearName] = useState('');
  // Create tileset inline error
  const [createTsError, setCreateTsError] = useState('');
  // Custom bg modal draft (null = not open; { bg1, bg2 } = current draft while open)
  const [customBgDraft, setCustomBgDraft] = useState(null);
  // Delete-from-db confirmation input (codename the user must type)
  // deleteConfirmInput, flagTooltip, deleteConfirmId live inside InfoModal (local state) to prevent App re-renders on every keystroke
  // flagTooltip lives inside InfoModal (local state) — see Bug 3 fix
  // Theme DB persistence debounce timer
  const themeDbTimerRef = useRef(null);

  // ── Session ───────────────────────────────────────────────────────────────
  // sessionState: 'restoring' (stored refresh token still usable, refresh in flight),
  // 'signedIn' (valid Firebase + Discord tokens) or 'signedOut' (show the login card).
  // tokenExpiry is the Discord access-token expiry; a stored refresh token with a
  // tokenExpiry in the future is restorable even when the 1 h Firebase ID token has lapsed.
  const computeSessionState = (u) => {
    if (!u) return 'signedOut';
    const now = Date.now();
    if (u.firebaseToken && (u.firebaseTokenExpiry ?? 0) - 90000 > now && (u.tokenExpiry ?? 0) - 90000 > now) return 'signedIn';
    if (u.refreshToken && (u.tokenExpiry ?? 0) > now) return 'restoring';
    return 'signedOut';
  };
  const [sessionState, setSessionState] = useState(() => computeSessionState(currentUser));
  const sessionStateRef = useRef(sessionState);
  sessionStateRef.current = sessionState;
  const currentUserRef = useRef(currentUser); // always the latest user (no stale closures)
  const refreshPromiseRef = useRef(null);      // single-flight refresh
  const [reconnecting, setReconnecting] = useState(false);
  const reconnectingRef = useRef(false);
  const dbTilesetsLenRef = useRef(0);
  dbTilesetsLenRef.current = dbTilesets.length;
  const validateSessionRef = useRef(null);

  const applyUser = (u) => {
    currentUserRef.current = u;
    setCurrentUser(u);
    try { if (u) localStorage.setItem('oph_user', JSON.stringify(u)); else localStorage.removeItem('oph_user'); } catch {}
  };
  const markReconnecting = (on) => {
    if (reconnectingRef.current === on) return;
    reconnectingRef.current = on;
    setReconnecting(on);
  };

  // One refresh attempt. Resolves { status: 'ok', token } | { status: 'rejected' } | { status: 'network' }.
  // 'rejected' = the server refused the credentials (Discord 400/401, Firebase mint 401);
  // 'network' = fetch failed, 429 or 5xx (credentials may still be good, so never log out for it).
  // force = re-mint the Firebase ID token even if it is not near expiry (used after a 401).
  const doRefresh = async (force) => {
    const u = currentUserRef.current;
    if (!u || (!u.firebaseToken && !u.refreshToken)) return { status: 'rejected' };
    const patch = {};
    const post = (path, body) => fetch(`${WORKER_URL}${path}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const classify = (res) => (res.status === 400 || res.status === 401) ? 'rejected' : 'network';

    const refreshDiscord = async () => {
      let res;
      try { res = await post('/discord-refresh', { refresh_token: u.refreshToken }); } catch { return 'network'; }
      if (!res.ok) return classify(res);
      try {
        const data = await res.json();
        patch.accessToken = data.access_token;
        patch.refreshToken = data.refresh_token;
        patch.tokenExpiry = Date.now() + data.expires_in * 1000;
        return 'ok';
      } catch { return 'network'; }
    };

    // 1. Discord access token (rotates the refresh token) when within 2 min of expiry.
    let discordRefreshed = false;
    if (u.refreshToken && Date.now() >= (u.tokenExpiry ?? 0) - 120000) {
      const r = await refreshDiscord();
      if (r === 'rejected') return { status: 'rejected' };
      if (r === 'network') {
        if (Date.now() >= (u.tokenExpiry ?? 0)) return { status: 'network' }; // access token unusable
      } else discordRefreshed = true;
    }

    // 2. Firebase ID token when forced, missing, or within 5 min of expiry.
    if (force || !u.firebaseToken || Date.now() >= (u.firebaseTokenExpiry ?? 0) - 300000) {
      const mint = async () => {
        const accessToken = patch.accessToken ?? u.accessToken;
        if (!accessToken) return 'rejected';
        let fbRes;
        try { fbRes = await post('/firebase-refresh', { access_token: accessToken }); } catch { return 'network'; }
        if (!fbRes.ok) return classify(fbRes);
        try {
          const { firebase_token: customToken } = await fbRes.json();
          await firebase.auth().signInWithCustomToken(customToken);
          patch.firebaseToken = await firebase.auth().currentUser.getIdToken();
          patch.firebaseTokenExpiry = Date.now() + 3600 * 1000;
          return 'ok';
        } catch { return 'network'; }
      };
      let r = await mint();
      if (r === 'rejected' && !discordRefreshed && u.refreshToken) {
        // Access token may simply be stale: rotate it once and retry.
        const d = await refreshDiscord();
        if (d === 'rejected') return { status: 'rejected' };
        if (d === 'ok') r = await mint();
        else r = 'network';
      }
      if (r !== 'ok') {
        if (Object.keys(patch).length > 0) applyUser({ ...currentUserRef.current, ...patch }); // keep a rotated refresh token
        return { status: r };
      }
    }

    const updated = { ...currentUserRef.current, ...patch };
    if (Object.keys(patch).length > 0) applyUser(updated);
    return { status: 'ok', token: updated.firebaseToken };
  };

  // Single-flight: concurrent callers share one in-flight refresh promise.
  const refreshSession = (force = false) => {
    if (refreshPromiseRef.current) return refreshPromiseRef.current;
    const p = doRefresh(force).then(r => {
      if (r.status === 'ok') {
        markReconnecting(false);
        setSessionState('signedIn');
      } else if (r.status === 'rejected') {
        markReconnecting(false);
        applyUser(null);
        setSessionState('signedOut');
      } else {
        markReconnecting(true);
      }
      return r;
    }).finally(() => { refreshPromiseRef.current = null; });
    refreshPromiseRef.current = p;
    return p;
  };

  // Returns a valid Firebase ID token, refreshing when near expiry. Returns null when the
  // session was rejected (login required); on a network failure returns the existing token.
  const getValidToken = async () => {
    const u = currentUserRef.current;
    if (!u?.firebaseToken && !u?.refreshToken) return null;
    const now = Date.now();
    const due = !u.firebaseToken ||
      now >= (u.firebaseTokenExpiry ?? 0) - 300000 ||
      (u.refreshToken && now >= (u.tokenExpiry ?? 0) - 120000);
    if (!due) return u.firebaseToken;
    const r = await refreshSession();
    if (r.status === 'ok') return r.token;
    if (r.status === 'rejected') return null;
    return currentUserRef.current?.firebaseToken ?? null;
  };

  // fetch wrapper for worker calls. Requests that carry an Authorization header get the
  // latest valid token; on 401 the token is force-refreshed and the request retried once.
  // A rejected refresh ends the session (signedOut); a network failure shows the
  // "Reconnecting..." banner and the session is re-validated on focus / online.
  const workerFetch = async (url, init = {}) => {
    const authed = !!(init.headers && init.headers.Authorization);
    const send = (token) => fetch(url, authed && token
      ? { ...init, headers: { ...init.headers, Authorization: `Bearer ${token}` } }
      : init);
    let res;
    try {
      res = await send(authed ? await getValidToken() : null);
    } catch (e) {
      markReconnecting(true);
      throw e;
    }
    if (authed && res.status === 401) {
      const r = await refreshSession(true);
      if (r.status === 'ok') {
        try { res = await send(r.token); } catch (e) { markReconnecting(true); throw e; }
      }
    }
    if (reconnectingRef.current && res.status < 500) markReconnecting(false);
    return res;
  };

  const isAuthenticated = sessionState === 'signedIn';
  const showLogin = sessionState === 'signedOut';

  // Re-validate on focus / visibility / online and on a timer, so expiry is evaluated while
  // the tab is idle (not only at render time).
  validateSessionRef.current = () => {
    const u = currentUserRef.current;
    if (!u || sessionStateRef.current === 'signedOut') return;
    const now = Date.now();
    const due = !u.firebaseToken ||
      now >= (u.firebaseTokenExpiry ?? 0) - 300000 ||
      (u.refreshToken && now >= (u.tokenExpiry ?? 0) - 120000);
    if (!due && !reconnectingRef.current) return;
    const wasReconnecting = reconnectingRef.current;
    refreshSession().then(r => {
      // A failed initial load (offline boot) is retried once the session is back.
      if (r.status === 'ok' && wasReconnecting && dbTilesetsLenRef.current === 0) setTsFetchTrigger(t => t + 1);
    });
  };
  useEffect(() => {
    const run = () => validateSessionRef.current && validateSessionRef.current();
    const onVisible = () => { if (document.visibilityState === 'visible') run(); };
    window.addEventListener('focus', run);
    window.addEventListener('online', run);
    document.addEventListener('visibilitychange', onVisible);
    const timer = setInterval(run, 60000);
    return () => {
      window.removeEventListener('focus', run);
      window.removeEventListener('online', run);
      document.removeEventListener('visibilitychange', onVisible);
      clearInterval(timer);
    };
  }, []);

  useEffect(() => {
    if (sessionStateRef.current === 'restoring') refreshSession(true);
  }, []);

  // Deep-link survival: restore the hash/search stashed before the Discord redirect.
  useEffect(() => {
    if (sessionState !== 'signedIn') return;
    try {
      const raw = sessionStorage.getItem('oph_return');
      if (!raw) return;
      sessionStorage.removeItem('oph_return');
      const { hash = '', search = '' } = JSON.parse(raw);

    } catch {}

  // Check Firebase auth state on mount; mark authChecked after minimum 1 s to prevent login flash

    const minDelay = new Promise(resolve => setTimeout(resolve, 1000));
    const authReady = new Promise(resolve => {
      const unsubscribe = firebase.auth().onAuthStateChanged(() => { unsubscribe(); resolve(); });
    });
    Promise.all([minDelay, authReady]).then(() => setAuthChecked(true));
  }, []);

  const tiles = useMemo(() => [...defaultTiles, ...userTiles], [defaultTiles, userTiles]);
  // ref -> tile over the contained list (active tileset + globals + uploads). Kept in refs for the stable-closure handlers.
  const tilesByRef = useMemo(() => new Map(tiles.map(t => [t.ref, t])), [tiles]);

  tilesListRef.current = tiles;

  useEffect(() => {
    if (!IS_DEV) return;
    const seen = new Set();

      if (seen.has(t.ref) && !WARNED_DUP_TILE_REFS.has(t.ref)) {

      }
      seen.add(t.ref);
    });

  const [gridW, setGridW] = useState(() => load(SK.gridW, GRID_W));
  const [gridH, setGridH] = useState(() => load(SK.gridH, GRID_H));

    if (s.includes("Teleporters/")) return { ox: 50, oy: 60 };
    // HealPad: centred on 2×2 area
    if (s.includes("HealPad")) return { ox: 50, oy: 50 };
    // Global unbreakable
    if (s.includes("Unbreakable")) return { ox: 0, oy: -12 };
    // Goal posts
    if (s.includes("goalRed") || s.includes("goalBlue")) return { ox: 0, oy: -50 };
    // Global objectives
    if (s.includes("Heist")) return { ox: 0, oy: -60 };
    if (s.includes("Brawl_Ball")) return { ox: 0, oy: -14 };
    if (s.includes("Bounty")) return { ox: 0, oy: 4 };
    // Rope Post_R / Post_TR tiles
    if (s.includes("/Rope/Post_R") || s.includes("/Rope/Post_TR")) return { ox: 25, oy: 0 };
    if (s.includes("SlowTile")) return { ox: 0, oy: 5 };
    if (s.includes("SpeedTile")) return { ox: 0, oy: 5 };
    if (s.includes("Smoke")) return { ox: 0, oy: -10 };
    if (s.includes("Spikes")) return { ox: 0, oy: -8 };
    return { ox: 0, oy: 0 };
  };

  const getTileOffset = t => {
    if (tileOffsets[t.ref] !== undefined) return tileOffsets[t.ref];
    return getDefaultOffset(t);
  };

  // Returns the effective offset for a cell, respecting per-cell overrides (from mirror-offset placement).
  const getEffectiveOffset = (t, r, c) => {
    const over = gridOffsets[`${r},${c}`];
    if (over !== undefined) return over;
    return getTileOffset(t);
  };

  // Spawn tile identification (src-based)
  const isSpawn1 = t => !!(t?.src && t.src.includes("Spawns/1.png")); // red
  const isSpawn2 = t => !!(t?.src && t.src.includes("Spawns/2.png")); // blue
  const isRespawn1 = t => !!(t?.src && t.src.includes("Spawns/5.png")); // red respawn
  const isRespawn2 = t => !!(t?.src && t.src.includes("Spawns/6.png")); // blue respawn
  const isGoalRed  = t => !!(t?.src && t.src.includes("goalRed.png"));
  const isGoalBlue = t => !!(t?.src && t.src.includes("goalBlue.png"));
  // Counterpart of a spawn / respawn / goal tile (team swap on mirror), found by src. Takes and returns a tile ref.
  const swapSpawnRef = (ref) => {
    const list = tilesListRef.current;
    const t = tilesByRefRef.current.get(ref);
    if (!t) return ref;
    const other = pred => list.find(pred)?.ref ?? ref;
    if (isSpawn1(t)) return other(isSpawn2);
    if (isSpawn2(t)) return other(isSpawn1);
    if (isRespawn1(t)) return other(isRespawn2);
    if (isRespawn2(t)) return other(isRespawn1);
    if (isGoalRed(t))  return other(isGoalBlue);
    if (isGoalBlue(t)) return other(isGoalRed);
    return ref;
  };

  // Water tiles have rotation on by default
  const isDefaultRotatable = t => {
    if (t?.dbRotatable != null) return !!t.dbRotatable;
    if (!t?.src || t.src.startsWith('data:')) return false;
    return TILE_SETTINGS.rotatable.some(p => t.src.includes(p));
  };

  const isTileRotatable = t => {
    if (rotatableMap[t.ref] !== undefined) return rotatableMap[t.ref];
    return isDefaultRotatable(t);
  };

  const isDefaultFlippable = t => {
    if (t?.dbFlippable != null) return !!t.dbFlippable;
    if (!t?.src || t.src.startsWith('data:')) return false;
    return TILE_SETTINGS.flippable.some(p => t.src.includes(p));
  };
  const isFlipAllowed = t => {
    if (allowFlipMap[t.ref] !== undefined) return allowFlipMap[t.ref];
    return isDefaultFlippable(t); // fence/rope flippable by default; water is spin-only
  };

  const isDefaultMirrorOffset = t => {
    if (t?.dbMirrorOffset != null) return !!t.dbMirrorOffset;
    if (!t?.src || t.src.startsWith('data:')) return false;
    return TILE_SETTINGS.mirrorOffset.some(p => t.src.includes(p));
  };
  const isMirrorOffset = t => {
    if (mirrorOffsetTiles[t.ref] !== undefined) return mirrorOffsetTiles[t.ref];
    return isDefaultMirrorOffset(t);
  };

  // OTG: which tiles count as walls by default (all except passable game-layer tiles)
  const isDefaultOTGWall = t => {
    if (t?.dbOtgPassable != null) return !t.dbOtgPassable;
    if (!t?.src) return false;
    return !TILE_SETTINGS.otgPassable.some(p => t.src.includes(p));
  };
  const isOTGWall = t => {
    if (otgWallOverrides[t.ref] !== undefined) return otgWallOverrides[t.ref];
    return isDefaultOTGWall(t);
  };

  // Tile defaults come straight off the tile (DB column, else the src-pattern fallback for global tiles).
  // The user override (sparse map keyed by ref) wins when present.
  const defaultPriorityTile   = t => t.dbPriority != null ? !!t.dbPriority : !!(t.src && TILE_SETTINGS.priority.some(p => t.src.includes(p)));
  const defaultBottomTile     = t => t.dbBottomRender != null ? !!t.dbBottomRender : !!(t.src && TILE_SETTINGS.bottomRender.some(p => t.src.includes(p)));
  const defaultAutoShadowTile = t => t.dbAutoShadow != null ? !!t.dbAutoShadow : false;
  const isPriorityTile   = t => priorityTiles[t.ref]   !== undefined ? !!priorityTiles[t.ref]   : defaultPriorityTile(t);
  const isBottomTile     = t => bottomTiles[t.ref]     !== undefined ? !!bottomTiles[t.ref]     : defaultBottomTile(t);
  const isAutoShadowTile = t => autoShadowTiles[t.ref] !== undefined ? !!autoShadowTiles[t.ref] : defaultAutoShadowTile(t);

  // Cells hold palette indexes; refAt(palette, index) gives the tile ref, getCellTile(index) the tile object.

  // Compute the set of OTG cells ("r,c" strings) — memoised so it only runs when the map/settings change
  const otgCells = useMemo(() => {
    if (!showOTG) return new Set();
    // For OTG purposes, map edges always count as walls
    const isWall = (r, c) => {
      if (r < 0 || r >= gridH || c < 0 || c >= gridW) return true; // edge = wall
      const id = grid[r]?.[c];
      if (id == null) return false;
      const t = tilesByRef.get(refAt(palette, id));
      if (!t || t.isSpace) return false;
      if (otgWallOverrides[t.ref] !== undefined) return otgWallOverrides[t.ref];
      return isDefaultOTGWall(t);
    };
    const isEmpty = (r, c) => r >= 0 && r < gridH && c >= 0 && c < gridW && !isWall(r, c);
    const result = new Set();

    // ── Check 1: opposing pair ────────────────────────────────────────
    // Flag an empty tile if any of 4 axis pairs are both walls/edges:
    // left+right, top+bottom, NW+SE, NE+SW  (edges count as walls)
    for (let r = 0; r < gridH; r++) {
      for (let c = 0; c < gridW; c++) {
        if (!isEmpty(r, c)) continue;
        if (isWall(r, c-1) && isWall(r, c+1)) { result.add(`${r},${c}`); continue; } // left+right
        if (isWall(r-1, c) && isWall(r+1, c)) { result.add(`${r},${c}`); continue; } // top+bottom
        if (isWall(r-1, c-1) && isWall(r+1, c+1) && !isWall(r, c-1) && !isWall(r-1, c)) { result.add(`${r},${c}`); continue; } // NW+SE
        if (isWall(r-1, c+1) && isWall(r+1, c-1) && !isWall(r, c+1) && !isWall(r-1, c)) { result.add(`${r},${c}`); continue; } // NE+SW
      }
    }

    // ── Check 2: 2×2 diagonal squeeze ────────────────────────────────
    // Scan every 2×2 block. If two diagonally opposing cells are both walls
    // and the other two are both empty, flag both empty cells.
    for (let r = 0; r < gridH - 1; r++) {
      for (let c = 0; c < gridW - 1; c++) {
        const tl = isWall(r, c), tr = isWall(r, c+1);
        const bl = isWall(r+1, c), br = isWall(r+1, c+1);
        // TL+BR walls, TR+BL empty
        if (tl && br && !tr && !bl) { result.add(`${r},${c+1}`); result.add(`${r+1},${c}`); }
        // TR+BL walls, TL+BR empty
        if (tr && bl && !tl && !br) { result.add(`${r},${c}`); result.add(`${r+1},${c+1}`); }
      }
    }

    // ── Check 3: 2×3 / 3×2 corner squeeze ────────────────────────────
    // 2×3 blocks (2 cols wide, 3 rows tall): opposite corners = walls, middles = empty → flag middles
    for (let r = 0; r < gridH - 2; r++) {
      for (let c = 0; c < gridW - 1; c++) {
        const tl = isWall(r, c), tr = isWall(r, c+1);
        const ml = isEmpty(r+1, c), mr = isEmpty(r+1, c+1);
        const bl = isWall(r+2, c), br = isWall(r+2, c+1);
        // top-left + bottom-right walls, both middle-row cells empty
        if (tl && br && ml && mr) { result.add(`${r+1},${c}`); result.add(`${r+1},${c+1}`); }
        // top-right + bottom-left walls, both middle-row cells empty
        if (tr && bl && ml && mr) { result.add(`${r+1},${c}`); result.add(`${r+1},${c+1}`); }
      }
    }
    // 3×2 blocks (3 cols wide, 2 rows tall): opposite corners = walls, middles = empty → flag middles
    for (let r = 0; r < gridH - 1; r++) {
      for (let c = 0; c < gridW - 2; c++) {
        const tl = isWall(r, c), tr = isWall(r, c+2);
        const ml = isEmpty(r, c+1), mr = isEmpty(r+1, c+1);
        const bl = isWall(r+1, c), br = isWall(r+1, c+2);
        // top-left + bottom-right walls, both middle-column cells empty
        if (tl && br && ml && mr) { result.add(`${r},${c+1}`); result.add(`${r+1},${c+1}`); }
        // top-right + bottom-left walls, both middle-column cells empty
        if (tr && bl && ml && mr) { result.add(`${r},${c+1}`); result.add(`${r+1},${c+1}`); }
      }
    }
    return result;
  }, [showOTG, grid, palette, gridW, gridH, otgWallOverrides, tilesByRef]);

  // MultLabel: shows size multiplier at top-left when != 1.0
  const MultLabel = ({ t }) => {
    const mult = getTileMultiplier(t);
    if (mult === 1.0) return null;
    if (hideDefaultLabels && mult === getDefaultMultiplier(t)) return null;
    return (
      <span style={{ position: "absolute", top: 1, left: 2, fontSize: 7, fontWeight: 700, color: C.accentBright, background: "rgba(0,0,0,0.65)", borderRadius: 3, padding: "1px 3px", lineHeight: 1.3, pointerEvents: "none", zIndex: 5 }}>
        {mult}×
      </span>
    );
  };

  // Pre-computed tile ref → count in grid (for CountBadge).
  const tileCounts = (() => {
    const counts = {};
    grid.forEach(row => row.forEach(id => { if (id != null) { const ref = refAt(palette, id); if (ref) counts[ref] = (counts[ref] ?? 0) + 1; } }));
    return counts;
  })();

  // Count badge shown at bottom-right of tile cards — driven by the per-tile DB field show_tile_count.
  const CountBadge = ({ t }) => {
    if (!t.dbShowTileCount) return null;
    const count = tileCounts[t.ref] ?? 0;
    if (count === 0) return null;
    return (
      <span style={{ position: "absolute", bottom: -7, right: -7, fontSize: 10, fontWeight: 800, color: "#ffffff", background: "#059669", borderRadius: 4, padding: "1px 4px", lineHeight: 1.4, pointerEvents: "none", zIndex: 8, boxShadow: "0 1px 4px rgba(0,0,0,0.7)" }}>
        ×{count}
      </span>
    );
  };

  // Badge label shown at bottom-left of tile cards (priority/offset/mirrorOffset badges, NOT multiplier)
  const TileBadge = ({ t }) => {
    const off    = getTileOffset(t);
    const defOff = getDefaultOffset(t);
    const hasOff = off.ox !== 0 || off.oy !== 0;
    const offIsDefault = off.ox === defOff.ox && off.oy === defOff.oy;
    const showOff       = hasOff && (!hideDefaultLabels || !offIsDefault);
    const isPrio        = isPriorityTile(t);
    const isBottom      = isBottomTile(t);
    const hasMirrorOff  = isMirrorOffset(t);
    const hasShadow     = isAutoShadowTile(t);
    // Default comes off the tile (DB column, else src-pattern check for global tiles)
    const prioDefault   = defaultPriorityTile(t);
    const bottomDefault = defaultBottomTile(t);
    const mirrorOffDefault = t.isDb ? !!t.dbMirrorOffset : !!(t.src && TILE_SETTINGS.mirrorOffset.some(p => t.src.includes(p)));
    const showPrio      = isPrio && (!hideDefaultLabels || !prioDefault);
    const showBottom    = isBottom && (!hideDefaultLabels || !bottomDefault);
    const showMirrorOff = hasMirrorOff && (!hideDefaultLabels || !mirrorOffDefault);
    if (!showOff && !showPrio && !showBottom && !showMirrorOff && !hasShadow) return null;
    const parts = [];
    if (showPrio)  parts.push("🚨");
    if (showBottom) parts.push("⚓");
    if (showOff)  parts.push("📐");
    if (showMirrorOff) parts.push("🌪️");
    if (hasShadow) parts.push("👻");
    return (
      <span style={{ position: "absolute", bottom: -7, left: -7, fontSize: 8, fontWeight: 700, color: C.accentBright, background: "rgba(0,0,0,0.65)", borderRadius: 3, padding: "1px 3px", lineHeight: 1.3, pointerEvents: "none", zIndex: 6 }}>
        {parts.join("")}
      </span>
    );
  };

  // Active tileset name (drives BG colour on switch, history tileset field)
  const [activeTileset, setActiveTileset] = useState(null);
  // Kept in sync during render: the earlier effect that syncs this ref lists activeTileset in its deps before the
  // variable exists (Babel's var hoisting makes that `undefined`), so it never re-ran and history snapshots recorded no tileset.
  activeTilesetRef.current = activeTileset ?? null;
  // Tileset dropdown open state
  const [tilesetDropOpen, setTilesetDropOpen] = useState(false);
  const [gridLoadWarning, setGridLoadWarning] = useState(null); // null or count of unresolved tiles
  const [gridWarnWhere, setGridWarnWhere] = useState("load"); // "load" (saved map) | "switch" (current map)
  const warnCleared = (count, where) => { setGridWarnWhere(where); setGridLoadWarning(count); };
  const [infoNotice, setInfoNotice] = useState(OPH_RESET_NOTICE); // null or a short dismissible message
  const [customBgModalOpen, setCustomBgModalOpen] = useState(false);
  const [bgDropOpen, setBgDropOpen] = useState(false);
  // Parsed manifest data (globals only)
  const [manifest, setManifest] = useState(null);
  useEffect(() => { openFolderKeyRef.current = openFolderKey; }, [openFolderKey]);
  // toggleFolder uses ref to read current value — avoids stale-closure reopening after
  // the outside-click mousedown handler closes the panel in the same event cycle.
  const toggleFolder = (key, e) => {
    if (openFolderKeyRef.current === key) {
      setOpenFolderKey(null);
    } else {
      setOpenFolderKey(key);
      if (e?.currentTarget) {
        const rect = e.currentTarget.getBoundingClientRect();
        setFolderPanelAnchor({ x: rect.right + 6, y: rect.top });
      }
    }
  };
  // Unfolded sensor folder: real variants (info button, clicking does NOT select), unlabelled tiles, then the derived variants
  // (generated, no info button) and the simulation button.
  const renderSensorPanel = entry => {
    const sensor = entry.sensor;
    const cands = sensorFolders.get(sensor.ref)?.candidates;
    const cardSz = isMobile ? 56 : 72;
    const cols = 4;
    const panelW = cardSz * cols + 5 * (cols - 1) + 12;
    const maxH = Math.min(520, window.innerHeight - 32);
    const anchorX = Math.min(folderPanelAnchor.x, window.innerWidth - panelW - 8);
    const anchorY = Math.min(folderPanelAnchor.y, window.innerHeight - maxH - 8);
    const hasWarn = sensor.warnings.length > 0 || sensor.unlabelled.length > 0;
    const heading = (text, extra) => (
      <div style={{ gridColumn: "1 / -1", fontSize: 9, fontWeight: 700, color: extra ? SENSOR_YELLOW : C.muted, textTransform: "uppercase", letterSpacing: 0.8, borderTop: extra ? `1px dashed ${SENSOR_YELLOW}` : "none", paddingTop: extra ? 8 : 0, marginTop: extra ? 4 : 0 }}>{text}</div>
    );
    const realCard = t => {
      const failed = failedTiles.has(t.ref);
      const isStarred = starredTiles.includes(t.ref);
      return (
        <div key={t.ref} data-sensor-variant={t.ref} title={`${t.codename ?? ""} ${t.sensorCode ?? "(no code)"}`.trim()}
          style={{ width: cardSz, height: cardSz, borderRadius: 8, border: `2px solid ${failed ? C.danger : C.border}`, position: "relative", overflow: "visible", opacity: failed ? 0.55 : 1 }}>
          <div style={{ position: "absolute", inset: 0, borderRadius: 6, overflow: "hidden", display: "flex", alignItems: "center", justifyContent: "center", background: C.panelDeep }}>
            {failed ? <span style={{ fontSize: 18 }}>⚠️</span>
              : <img src={t.blobSrc ?? t.src} alt="" onError={() => markFailed(t.ref)} className={tileCardLightBg ? "tile-img-checker" : undefined} style={{ width: "100%", height: "100%", objectFit: "contain", imageRendering: "pixelated" }} />}
          </div>
          <span style={{ position: "absolute", left: 2, bottom: 1, fontSize: 7, fontFamily: "monospace", color: "#fff", background: "rgba(0,0,0,0.65)", borderRadius: 3, padding: "0 2px", pointerEvents: "none" }}>{t.sensorCode ?? "no code"}</span>
          <span onClick={ev => { ev.stopPropagation(); setInfoTile(t.ref); }}
            style={{ position: "absolute", top: -7, right: -7, width: 18, height: 18, fontSize: 15, cursor: "pointer", color: isStarred ? "#fbbf24" : "rgba(255,255,255,0.85)", lineHeight: "18px", textAlign: "center", zIndex: 6, background: "rgba(0,0,0,0.7)", borderRadius: "50%" }}
            title="Tile info">ⓘ</span>
        </div>
      );
    };
    const derived = cands ? SensorEngine.ALL_CODES.map(c => cands[c]).filter(c => c.status === "derived" || c.status === "composed") : [];
    return (
      <div ref={folderPanelRef} data-sensor-panel={sensor.ref}
        style={{ position: "fixed", left: anchorX, top: anchorY, width: panelW, maxHeight: maxH, background: C.panel, border: `1px solid ${SENSOR_YELLOW}`, borderRadius: 10,
          boxShadow: "0 8px 32px rgba(0,0,0,0.7), 0 0 10px rgba(245,197,24,0.35)", zIndex: 2000, overflow: "hidden", display: "flex", flexDirection: "column" }}>
        <div style={{ padding: "5px 8px", borderBottom: `1px solid ${C.border}`, display: "flex", alignItems: "center", justifyContent: "space-between", flexShrink: 0, gap: 6 }}>
          <span style={{ fontSize: 10, fontWeight: 700, color: SENSOR_YELLOW, letterSpacing: 0.5 }}>✨ {entry.label}</span>
          <span style={{ display: "flex", alignItems: "center", gap: 6 }}>
            {hasWarn && <button onClick={() => setSensorWarnFolder(sensor)} style={{ ...sensorBtnStyle(SENSOR_YELLOW), padding: "0 6px", fontSize: 12 }} title="Shared settings differ / tiles without a code">⚠</button>}
            <button onClick={() => setOpenFolderKey(null)} style={{ background: "none", border: "none", cursor: "pointer", color: C.muted, fontSize: 15, lineHeight: 1, padding: "0 2px" }}>×</button>
          </span>
        </div>
        <div style={{ overflowY: "auto", padding: 6 }}>
          <div style={{ display: "grid", gridTemplateColumns: `repeat(${cols}, ${cardSz}px)`, gap: 5 }}>
            {heading(`Variants (${sensor.labelled.length})`)}
            {sensor.labelled.map(realCard)}
            {sensor.unlabelled.length > 0 && heading(`Unlabelled (not auto-placed) (${sensor.unlabelled.length})`)}
            {sensor.unlabelled.map(realCard)}
            {derived.length > 0 && heading(`Derived (${derived.length}) - generated, not editable`, true)}
            {derived.map(cd => {
              const e = cd.pool[0];
              const vis = sensorEntryVisual(e, cd.code, cd.status, cd.recipe, sensor.ref, cands, requestComposed);
              const label = cd.status === "composed" ? "composed from the base tiles" : fromLabel(e);
              return (
                <div key={cd.code} data-sensor-derived={cd.code} title={`${cd.code}: ${label}`} style={{ width: cardSz }}>
                  <div style={{ width: cardSz, height: cardSz, borderRadius: 8, border: `1px dashed ${SENSOR_YELLOW}`, background: C.panelDeep, overflow: "hidden", display: "flex", alignItems: "center", justifyContent: "center", position: "relative" }}>
                    {vis.src ? <img src={vis.src} alt="" style={{ width: "100%", height: "100%", objectFit: "contain", imageRendering: "pixelated", transform: vis.css || undefined, opacity: vis.state === "pending" ? 0.4 : 1 }} /> : <span style={{ fontSize: 14 }}>…</span>}
                    <span style={{ position: "absolute", left: 2, bottom: 1, fontSize: 7, fontFamily: "monospace", color: "#fff", background: "rgba(0,0,0,0.65)", borderRadius: 3, padding: "0 2px" }}>{cd.code}</span>
                  </div>
                  <div style={{ fontSize: 8, color: C.muted, lineHeight: 1.2, marginTop: 2, wordBreak: "break-word" }}>{label}</div>
                </div>
              );
            })}
          </div>
          <div style={{ marginTop: 8 }}>
            <button data-sensor-sim-open={sensor.ref} style={sensorBtnStyle(SENSOR_YELLOW)} onClick={() => setSensorSimFolder(sensor.ref)}>Sensor folder simulation</button>
          </div>
        </div>
      </div>
    );
  };
  // Close folder panel on outside click
  useEffect(() => {
    if (!openFolderKey) return;
    const handler = ev => {
      if (folderPanelRef.current && !folderPanelRef.current.contains(ev.target)) {
        setOpenFolderKey(null);
      }
    };
    document.addEventListener('mousedown', handler);
    document.addEventListener('touchstart', handler);
    return () => {
      document.removeEventListener('mousedown', handler);
      document.removeEventListener('touchstart', handler);
    };
  }, [openFolderKey]);

  // Build the flat defaultTiles list and the ordered panel entries from DB tilesets + global manifest.
  // DB tiles come from buildDbTile (ref d:<uuid>); global tiles get ref g:<Resources path>.
  // Returns: tilesetEntriesPerTs, tilesetEntries, globalEntries, flatDefaultTiles, tilesetTileCount
  const { tilesetEntriesPerTs, tilesetEntries, globalEntries, flatDefaultTiles, tilesetTileCount } = useMemo(() => {
    const flatTiles = [];

    // ── DB tilesets (active one only) ──
    const entriesPerTs = [];
    let tsCount = 0;

    for (const tsDef of dbTilesets) {
      const isActive = tsDef.name === activeTileset;
      // Containment: only the active tileset's tiles may reach flatDefaultTiles (dbTilesByTsId stays a fetch cache).
      if (!isActive) continue;
      const tilesForTs = (dbTilesByTsId[tsDef.id] ?? []).slice().sort((a, b) => a.sort_index - b.sort_index);
      const entries = [];
      const folderGroups = {};
      const flatItems = [];

      for (const row of tilesForTs) {
        const tileObj = buildDbTile(row, tsDef);
        if (row.folder_key) {
          if (!folderGroups[row.folder_key]) folderGroups[row.folder_key] = [];
          folderGroups[row.folder_key].push(tileObj);
        } else {
          flatItems.push(tileObj);
        }
        flatTiles.push(tileObj);
      }

      if (isActive) {
        flatItems.forEach(t => entries.push({ type: 'flat', tile: t }));
        Object.entries(folderGroups).forEach(([key, tiles]) => {
          // A folder with at least one coded tile is a sensor folder; its logical tile joins the contained list.
          const sensor = SensorUI.makeFolder({ scope: tsDef.id, folderKey: key, label: key, tiles });
          if (sensor) flatTiles.push(buildSensorTile(sensor));
          entries.push({ type: 'folder', key: `${tsDef.name}/${key}`, label: key, tiles, sensor });
        });
        const cnt = entries.reduce((n, e) => n + (e.tiles?.length ?? 1), 0);
        entriesPerTs.push({ name: tsDef.name, entries, count: cnt, tilesetId: tsDef.id, tilesetOwnerId: tsDef.owner_id });
        tsCount += cnt;
      }
    }

    // ── Global tiles from manifest — ref g:<Resources path>; displayKey is manifest order, display only (never persisted) ──
    let gKeyCounter = 1;
    const makeTile = src => ({ ref: makeRef("g", `Resources/${src}`), displayKey: gKeyCounter++, src: `Resources/${src}`, isDefault: true });
    const displayLabel = (key, folderPath) => {
      if (folderPath) { const s = folderPath.replace(/\/$/, '').split('/').pop(); if (s) return s; }
      return key;
    };
    const gDef = manifest?.global;
    const glbEntries = [];
    if (gDef) {
      for (const key of (gDef.order ?? [])) {
        const files = gDef.folders?.[key];
        if (!files || files.length === 0) continue;
        const folderPath = gDef.folderPaths?.[key] ?? `Global/${key}/`;
        const label = displayLabel(key, folderPath);
        const sensorCfg = gDef.sensor?.[key]; // optional { codes: {file: code}, spin, flip, symbol }
        const folderTiles = files
          .map((fn, i) => {
            const t = makeTile(`${folderPath}${fn}`);
            t.folderKey = `global_${key}`; t.folderLabel = label;
            t.codename = `Global_${fn.replace(/\.[^.]+$/, '')}`;
            if (sensorCfg) {
              t.sensorCode = sensorCfg.codes?.[fn] ?? null; t.sensorRoll = 1; t.sortIndex = i;
              t.dbRotatable = !!sensorCfg.spin; t.dbFlippable = !!sensorCfg.flip; t.symbol = sensorCfg.symbol ?? null;
            }
            return t;
          });
        flatTiles.push(...folderTiles);
        const sensor = sensorCfg ? SensorUI.makeFolder({ scope: SensorUI.SCOPE_GLOBAL, folderKey: key, label, tiles: folderTiles, cfg: sensorCfg }) : null;
        if (sensor) flatTiles.push(buildSensorTile(sensor));
        glbEntries.push({ type: 'folder', key: `global_${key}`, label, tiles: folderTiles, sensor });
      }
    }

    const tsEntries = entriesPerTs.flatMap(ts => ts.entries);
    return { tilesetEntriesPerTs: entriesPerTs, tilesetEntries: tsEntries, globalEntries: glbEntries, flatDefaultTiles: flatTiles, tilesetTileCount: tsCount };
  }, [manifest, activeTileset, dbTilesets, dbTilesByTsId]);

  // ── Sensor folders: candidates per folder, and the derived layer ──
  // sensorFolders: Map(s: ref -> { ui (folder), folder (engine view), candidates }). The map stores only the logical s: entry;
  // sensorLayer derives, per cell, which variant to show from the grid (memoised on grid / palette / folders, never saved).
  const sensorFolders = useMemo(() => {
    const m = new Map();
    [...tilesetEntries, ...globalEntries].forEach(e => {
      if (e.type !== 'folder' || !e.sensor) return;
      const folder = SensorUI.engineFolder(e.sensor);
      m.set(e.sensor.ref, { ui: e.sensor, folder, candidates: SensorEngine.buildCandidates(folder) });
    });
    return m;
  }, [tilesetEntries, globalEntries]);
  const sensorLayer = useMemo(() => SensorUI.deriveLayer({ grid, refs: palette.refs, folders: sensorFolders }), [grid, palette, sensorFolders]);

  // Composed variants (quadrants of the base tiles drawn on a canvas). Cache: key -> blob URL | "fail" | "pending".
  const composedRef = useRef(new Map());
  const [, setComposedTick] = useState(0);
  const loadTileImage = src => new Promise((resolve, reject) => {
    const im = new Image();
    im.crossOrigin = "anonymous"; // needed so toBlob() is not blocked by a tainted canvas
    im.onload = () => resolve(im);
    im.onerror = () => reject(new Error(`image failed to load: ${src}`));
    im.src = src;
  });
  const tileImageUrl = ref => { const t = tilesByRefRef.current.get(ref); return t ? (t.blobSrc ?? t.src) : null; };
  const composedKeyFor = (folderRef, code, recipe) => `${SensorUI.composeKey(folderRef, code)}|${recipe.map(e => tileImageUrl(e.sourceTileRef)).join(",")}`;
  const composeVariant = async recipe => {
    const imgs = new Map();
    for (const e of recipe) {
      if (imgs.has(e.sourceTileRef)) continue;
      const url = tileImageUrl(e.sourceTileRef);
      if (!url) throw new Error(`missing base tile ${e.sourceTileRef}`);
      imgs.set(e.sourceTileRef, await loadTileImage(url));
    }
    const first = imgs.values().next().value;
    const W = first.naturalWidth || 100, H = first.naturalHeight || 100;
    const cv = document.createElement("canvas");
    cv.width = W; cv.height = H;
    const ctx = cv.getContext("2d");
    ctx.imageSmoothingEnabled = false;
    for (const p of SensorUI.composePlan(recipe, W, H)) {
      ctx.save();
      ctx.beginPath(); ctx.rect(p.x, p.y, p.w, p.h); ctx.clip();
      ctx.translate(W / 2, H / 2); ctx.rotate(p.steps * Math.PI / 2);
      ctx.drawImage(imgs.get(p.sourceTileRef), -W / 2, -H / 2, W, H);
      ctx.restore();
    }
    const blob = await new Promise((resolve, reject) => cv.toBlob(b => (b ? resolve(b) : reject(new Error("toBlob returned null"))), "image/png"));
    return URL.createObjectURL(blob);
  };
  // -> blob URL when ready, "fail" when composing failed (CORS taint / missing base), null while pending. Starts the work once.
  const requestComposed = (folderRef, code, recipe) => {
    const key = composedKeyFor(folderRef, code, recipe);
    const cache = composedRef.current;
    const hit = cache.get(key);
    if (hit === undefined) {
      cache.set(key, "pending");
      composeVariant(recipe)
        .then(url => cache.set(key, url))
        .catch(err => { console.warn(`[sensor] compose failed for ${folderRef} ${code}:`, err); cache.set(key, "fail"); })
        .finally(() => setComposedTick(n => n + 1));
      return null;
    }
    return hit === "pending" ? null : hit;
  };
  useEffect(() => {
    sensorLayer.forEach(d => { if (!d.warn && d.status === "composed") requestComposed(d.folderRef, d.code, d.recipe); });
  }, [sensorLayer]); // eslint-disable-line react-hooks/exhaustive-deps

  // What to draw in a cell holding a sensor tile: { src, css } (css = extra transform for derived variants) or { warn: true }.
  // Composed variants fall back to the folder's 00000000 variant while pending or when composing fails.
  const sensorVisual = (t, r, c) => {
    const d = sensorLayer.get(`${r},${c}`);
    if (!d || d.warn) return { warn: true };
    if (d.status === "composed") {
      const url = requestComposed(d.folderRef, d.code, d.recipe);
      if (url && url !== "fail") return { src: url, css: "" };
      const fb = sensorFolders.get(d.folderRef)?.candidates["00000000"];
      const fbTile = fb && fb.status === "explicit" ? fb.pool[0].tile : null;
      return fbTile ? { src: fbTile.blobSrc ?? fbTile.src, css: "" } : { warn: true };
    }
    return { src: d.tile.blobSrc ?? d.tile.src, css: SensorUI.opsToCss(d.ops) };
  };

  // Switch tileset — updates the tile panel and BG colours, and converts board tiles by codename.
  // Fetches the new tileset's tiles if not yet cached, then rewrites the matching PALETTE ENTRIES (cells stay untouched).
  // Entries with no codename match go through the compat flow (replacement picked per entry, default: the warn tile).
  const switchTileset = async (newTilesetName) => {
    if (newTilesetName === activeTileset) return;

    const newTsDef = dbTilesets.find(ts => ts.name === newTilesetName);
    const oldTsDef = dbTilesets.find(ts => ts.name === activeTileset);

    // ── 1. Fetch new tileset's tiles if not already cached ──────────────
    let newTilesCached = dbTilesByTsIdRef.current[newTsDef?.id];
    if (newTsDef && newTilesCached === undefined) {
      try {
        const token = currentUser?.firebaseToken ? await getValidToken() : null;
        const tilesUrl = new URL(`${WORKER_URL}/rest/v1/tiles`);
        tilesUrl.searchParams.set('tileset_id', `eq.${newTsDef.id}`);
        tilesUrl.searchParams.set('order', 'sort_index');
        const hdrs = token
          ? { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
          : { 'Content-Type': 'application/json' };
        const resp = await workerFetch(tilesUrl.toString(), { headers: hdrs });
        const rows = resp.ok ? await resp.json() : [];
        newTilesCached = Array.isArray(rows) ? rows : [];
        setDbTilesByTsId(prev => ({ ...prev, [newTsDef.id]: newTilesCached }));
        dbTilesByTsIdRef.current = { ...dbTilesByTsIdRef.current, [newTsDef.id]: newTilesCached };
      } catch (err) {
        console.error('[tiles] switch fetch exception:', err);
        newTilesCached = [];
      }
    }

    // ── 2. Plan: which palette entries convert, which need a replacement, which are foreign ──
    const oldRows = oldTsDef ? (dbTilesByTsIdRef.current[oldTsDef.id] ?? []) : [];
    const newRows = newTsDef ? (dbTilesByTsIdRef.current[newTsDef.id] ?? []) : [];
    const plan = planSwitch(paletteRef.current, oldRows, newRows);

    // For Objectives tiles with no codename match in the new tileset, suggest an
    // equivalent global tile (Brawl Ball / Gem Grab / Heist) as the default remap.
    const findObjectiveFallback = tile => {
      const cn = tile?.codename ?? '';
      const folderKey = tile?.folderLabel ?? '';
      const KNOWN = ['BrawlBall', 'GemMine', 'HeistSafe', 'Ball', 'Safe'];
      const isObjective = folderKey === 'Objectives' || KNOWN.some(k => cn.includes(k));
      if (!isObjective) return null;
      let needle = null;
      if (cn.includes('GemMine')) needle = 'Gem_Grab';
      else if (cn.includes('BrawlBall') || cn.includes('Ball')) needle = 'Brawl_Ball';
      else if (cn.includes('HeistSafe') || cn.includes('Safe')) needle = 'Heist';
      if (!needle) return null;
      const g = flatDefaultTiles.find(t => !t.isDb && t.src && t.src.includes(needle));
      return g ? g.ref : null;
    };

    // ── 3. BG colours: DB record → OPHELIA_BG → cached → app default ───
    const dbBg = (newTsDef?.bg_color_light && newTsDef?.bg_color_dark)
      ? { bg1: newTsDef.bg_color_light, bg2: newTsDef.bg_color_dark }
      : null;
    const opheliaBg = OPHELIA_BG[newTilesetName] ?? null;
    const tsBg = dbBg ?? opheliaBg ?? { bg1: "#1a2332", bg2: "#1e2838" };

    // Entries with no codename match: ask what to replace them with
    if (plan.mismatches.length > 0 && newTsDef) {
      const mismatches = plan.mismatches.map(m => {
        const tile = tilesByRefRef.current.get(m.ref);
        return { ref: m.ref, codename: m.codename ?? m.ref, src: tile?.src, fallbackRef: findObjectiveFallback(tile) };
      });
      setTilesetSwitchPending({
        newTilesetName, newTsDef, oldTsDef,
        newTilesCached, tsBg, mismatches,
        remaps: Object.fromEntries(mismatches.map(m => [m.ref, m.fallbackRef ?? WARN_REF])),
      });
      return;
    }
    finishSwitch(newTilesetName, newTsDef, oldTsDef, {}, tsBg);
  };

  // Applies a switch: palette entries rewritten (remapEntry), history snapshot, tileset + BG, per-tile cleanup.
  const finishSwitch = (newTilesetName, newTsDef, oldTsDef, remaps, tsBg) => {
    const oldRows = oldTsDef ? (dbTilesByTsIdRef.current[oldTsDef.id] ?? []) : [];
    const newRows = newTsDef ? (dbTilesByTsIdRef.current[newTsDef.id] ?? []) : [];
    const currentGrid = gridRef.current;
    const plan = planSwitch(paletteRef.current, oldRows, newRows);
    let newGrid = currentGrid, newPal = paletteRef.current, clearedCount = 0;
    if (newTsDef) {
      const r = applySwitchPlan(paletteRef.current, currentGrid, plan, remaps);
      newGrid = r.grid; newPal = r.palette; clearedCount = r.cleared;
    }

    // ── History snap with the converted grid + palette, then apply state ──
    const snap = { grid: newGrid, palette: clonePalette(newPal), w: gridWRef.current, h: gridHRef.current, tileset: newTilesetName, bg1: tsBg.bg1, bg2: tsBg.bg2, highlight: [...highlightedCellsRef.current], rots: gridRotationsRef.current, flips: gridFlipsRef.current, label: `Switch from ${activeTileset ?? '(none)'} to ${newTilesetName}` };
    setHistory(h => {
      const trimmed = h.slice(0, histIdxRef.current + 1);
      const capped  = trimmed.length >= MAX_HISTORY ? trimmed.slice(1) : trimmed;
      return [...capped, snap];
    });
    setHistIdx(i => Math.min(i + 1, MAX_HISTORY - 1));
    if (newPal !== paletteRef.current) replacePalette(newPal);
    if (newGrid !== currentGrid) setGridRaw(newGrid);
    setActiveTileset(newTilesetName);
    applyBgPreset(newTilesetName, tsBg.bg1, tsBg.bg2);
    if (clearedCount > 0) warnCleared(clearedCount, "switch");

    // Overrides of the outgoing tileset's tiles are dropped by the "ref no longer exists" guard once the new tileset is the
    // contained one. Starred / recent / current selection that point at the outgoing tileset go now.
    if (oldTsDef) {
      const oldRefs = new Set(oldRows.map(r => makeRef("d", r.id)));
      const toNew = new Map(plan.matched.map(m => [m.from, m.to]));
      setStarredTiles(prev => prev.filter(s => !oldRefs.has(s)));
      setRecentTileIds(prev => prev.filter(id => !oldRefs.has(id)));
      setSel(prev => (prev && oldRefs.has(prev)) ? (toNew.get(prev) ?? null) : prev);
    }
  };

  // Sync defaultTiles whenever flatDefaultTiles changes. Flags are read off the tile objects now (no rebuilt flag maps).
  useEffect(() => {
    setDefaultTiles(flatDefaultTiles);
    if (flatDefaultTiles.length > 0) {
      setSel(prev => prev ?? flatDefaultTiles[0].ref);
    }
  }, [flatDefaultTiles]);

  // Guard: drop every per-ref override (and per-ref card state) whose ref is no longer among the loaded tiles
  // (a tileset switch, a deleted tile or upload). Waits until the contained list is complete so a half-loaded app
  // cannot wipe overrides: manifest loaded, tile fetch done, active tileset's rows cached.
  useEffect(() => {
    if (!manifest || tilesLoading || !dbTilesets.length) return;
    const tsDefG = dbTilesets.find(ts => ts.name === activeTileset);
    if (tsDefG && dbTilesByTsId[tsDefG.id] === undefined) return;
    const known = new Set(flatDefaultTiles.map(t => t.ref));
    userTiles.forEach(t => known.add(t.ref));
    const prune = obj => {
      let changed = false;
      const next = {};
      Object.keys(obj).forEach(k => { if (known.has(k)) next[k] = obj[k]; else changed = true; });
      return changed ? next : obj;
    };
    setTileMultipliers(prune);
    setTileOffsets(prune);
    setRotatableMap(prune);
    setAllowFlipMap(prune);
    setMirrorOffsetTiles(prune);
    setOtgWallOverrides(prune);
    setPriorityTiles(prune);
    setBottomTiles(prune);
    setAutoShadowTiles(prune);
    setTileNames(prune);
    setTileCountMap(prune);
    setCardRotations(prune);
    setCardFlipSteps(prune);
    setCardFlipModes(prune);
  }, [flatDefaultTiles, userTiles, manifest, tilesLoading, dbTilesByTsId, dbTilesets, activeTileset]);

  // Load global manifest + tilesets list. Tiles are loaded on demand per tileset.
  useEffect(() => {
    fetch("Resources/manifest.json")
      .then(r => r.ok ? r.json() : {})
      .then(data => setManifest({ global: data.global }))
      .catch(() => setManifest({ global: null }));

    if (!isAuthenticated) {
      setDbTilesets([]);
      setDbTilesByTsId({});
      dbTilesByTsIdRef.current = {};
      setTilesLoading(false);
      return;
    }

    (async () => {
      const isAdmin = userProfile?.role === 'admin';
      const tsBase = new URL(`${WORKER_URL}/rest/v1/tilesets`);
      if (isAdmin) {
        // admins see all tilesets
      } else if (currentUser?.id) {
        tsBase.searchParams.set('or', `(is_published.eq.true,owner_id.eq.${currentUser.id})`);
      } else {
        tsBase.searchParams.set('is_published', 'eq.true');
      }
      tsBase.searchParams.set('order', 'name');
      tsBase.searchParams.set('select', '*,profiles(username)');
      const token = currentUser?.firebaseToken ? await getValidToken() : null;
      const tsHeaders = token
        ? { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
        : { 'Content-Type': 'application/json' };
      try {
        const tsResp = await workerFetch(tsBase.toString(), { headers: tsHeaders });
        if (!tsResp.ok) {
          console.error('[tilesets] fetch failed:', tsResp.status, tsResp.statusText, await tsResp.text());
        }
        const tilesets = tsResp.ok ? await tsResp.json() : [];
        if (!Array.isArray(tilesets) || tilesets.length === 0) {
          console.error('[tilesets] empty or invalid response:', tilesets);
          setDbTilesets([]);
          setDbTilesByTsId({});
          dbTilesByTsIdRef.current = {};
          setTilesLoading(false);
          return;
        }

        // Clear tile cache whenever tilesets are re-fetched (re-auth or tsFetchTrigger)
        setDbTilesByTsId({});
        dbTilesByTsIdRef.current = {};
        setDbTilesets(tilesets);

        // Default to saved tileset if still valid; otherwise seed_id 0, else first published by name, else first
        const saved = load(SK.activeTileset, null);
        const published = tilesets.filter(ts => ts.is_published);
        const mostRecent = (published.find(ts => ts.seed_id === 0) ?? [...published].sort((a, b) => a.name.localeCompare(b.name))[0] ?? tilesets[0])?.name ?? null;
        const name = (saved && tilesets.some(ts => ts.name === saved)) ? saved : mostRecent;
        setActiveTileset(name);

        // Pre-fetch tiles for the active tileset before unblocking grid resolution,
        // so d: prefix tiles are in flatDefaultTiles when the resolution effect fires.
        const fetchedTilesMap = {};
        if (name) {
          const tsDef = tilesets.find(ts => ts.name === name);
          if (tsDef) {
            const tilesUrl = new URL(`${WORKER_URL}/rest/v1/tiles`);
            tilesUrl.searchParams.set('tileset_id', `eq.${tsDef.id}`);
            tilesUrl.searchParams.set('order', 'sort_index');
            try {
              const tilesResp = await workerFetch(tilesUrl.toString(), { headers: tsHeaders });
              const rows = tilesResp.ok ? await tilesResp.json() : [];
              const tilesData = Array.isArray(rows) ? rows : [];
              fetchedTilesMap[tsDef.id] = tilesData;
            } catch (err) {
              console.error('[tiles] initial fetch exception:', err);
            }
          }
        }
        // Scan pendingGridLoadRef palette for d: UUIDs not covered by the active tileset
        try {
          const savedRefs = pendingGridLoadRef.current?.palette?.refs ?? [];
          const dUuids = savedRefs.filter(k => typeof k === 'string' && k.startsWith('d:')).map(k => k.slice(2));
          const activeTsDef = name ? tilesets.find(ts => ts.name === name) : null;
          const activeTiles = activeTsDef ? (fetchedTilesMap[activeTsDef.id] ?? []) : [];
          const coveredTileIds = new Set(activeTiles.map(t => t.id));
          const uncoveredUuids = dUuids.filter(uuid => !coveredTileIds.has(uuid));
          if (uncoveredUuids.length > 0) {
            // Batch lookup: find which tilesets these tiles belong to
            const extraTsIds = new Set();
            await Promise.all(uncoveredUuids.map(async uuid => {
              try {
                const tileUrl = `${WORKER_URL}/rest/v1/tiles?id=eq.${uuid}&select=tileset_id`;
                const resp = await workerFetch(tileUrl, { headers: tsHeaders });
                if (resp.ok) {
                  const rows = await resp.json();
                  if (Array.isArray(rows) && rows[0]?.tileset_id) extraTsIds.add(rows[0].tileset_id);
                }
              } catch {}
            }));
            // Fetch tiles for each newly discovered tileset not already fetched
            await Promise.all([...extraTsIds].filter(tsId => !fetchedTilesMap[tsId]).map(async tsId => {
              try {
                const tilesUrl = new URL(`${WORKER_URL}/rest/v1/tiles`);
                tilesUrl.searchParams.set('tileset_id', `eq.${tsId}`);
                tilesUrl.searchParams.set('order', 'sort_index');
                const resp = await workerFetch(tilesUrl.toString(), { headers: tsHeaders });
                const rows = resp.ok ? await resp.json() : [];
                fetchedTilesMap[tsId] = Array.isArray(rows) ? rows : [];
              } catch (err) {
                console.error('[tiles] extra tileset fetch exception:', err);
              }
            }));
          }
        } catch (err) {
          console.error('[tiles] palette scan exception:', err);
        }
        setDbTilesByTsId(fetchedTilesMap);
        dbTilesByTsIdRef.current = fetchedTilesMap;
        setTilesLoading(false);
      } catch (err) {
        console.error('[tilesets] exception during fetch:', err);
        setTilesLoading(false);
      }
    })();
  }, [currentUser?.id, tsFetchTrigger, userProfile?.role, isAuthenticated]);

  // On-demand tile loading: fetch tiles for the active tileset if not yet cached
  useEffect(() => {
    if (!activeTileset || !isAuthenticated || !dbTilesets.length) return;
    const tsDef = dbTilesets.find(ts => ts.name === activeTileset);
    if (!tsDef || dbTilesByTsIdRef.current[tsDef.id] !== undefined) return;

    (async () => {
      const token = currentUser?.firebaseToken ? await getValidToken() : null;
      const tilesUrl = new URL(`${WORKER_URL}/rest/v1/tiles`);
      tilesUrl.searchParams.set('tileset_id', `eq.${tsDef.id}`);
      tilesUrl.searchParams.set('order', 'sort_index');
      const headers = token
        ? { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
        : { 'Content-Type': 'application/json' };
      try {
        const resp = await workerFetch(tilesUrl.toString(), { headers });
        const rows = resp.ok ? await resp.json() : [];
        const tilesData = Array.isArray(rows) ? rows : [];
        setDbTilesByTsId(prev => ({ ...prev, [tsDef.id]: tilesData }));
        dbTilesByTsIdRef.current = { ...dbTilesByTsIdRef.current, [tsDef.id]: tilesData };
      } catch (err) {
        console.error('[tiles] on-demand fetch exception:', err);
      }
    })();
  }, [activeTileset, dbTilesets]);

  // Fetch user profile (role) from Supabase when logged in
  useEffect(() => {
    if (!currentUser?.firebaseToken || !currentUser?.id) { setUserProfile(null); return; }
    (async () => {
      const token = await getValidToken();
      workerFetch(`${WORKER_URL}/rest/v1/profiles?id=eq.${currentUser.id}&select=id,username,avatar_hash,role,theme`, {
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
      }).then(r => r.ok ? r.json() : []).then(rows => {
        const profile = rows[0] ?? null;
        setUserProfile(profile);
        // Apply stored theme from DB (issue 14)
        if (profile?.theme && profile.theme !== 'auto') {
          setAutoTheme(false);
          setUiTheme(profile.theme === 'cold' ? 'cold' : 'warm');
        } else if (profile?.theme === 'auto') {
          setAutoTheme(true);
        }
      }).catch(() => setUserProfile(null));
    })();
  }, [currentUser]);

  // Fetch all profiles when admin modal opens
  useEffect(() => {
    if (!adminOpen || !currentUser?.firebaseToken) return;
    setAdminLoading(true);
    (async () => {
      const token = await getValidToken();
      workerFetch(`${WORKER_URL}/rest/v1/profiles?select=id,username,avatar_hash,role&order=username`, {
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
      }).then(r => r.ok ? r.json() : []).then(rows => { setAdminProfiles(rows); setAdminLoading(false); }).catch(() => setAdminLoading(false));
    })();
  }, [adminOpen, currentUser]);

  // Change a user's role (admin only; cannot set to 'admin')
  const changeUserRole = async (profileId, newRole) => {
    if (newRole === 'admin') return; // client-side guard
    setAdminRoleChanging(prev => new Set([...prev, profileId]));
    try {
      const token = await getValidToken();
      const resp = await workerFetch(`${WORKER_URL}/rest/v1/profiles?id=eq.${profileId}`, {
        method: 'PATCH',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=representation',
        },
        body: JSON.stringify({ role: newRole }),
      });
      if (resp.ok) {
        setAdminProfiles(prev => prev.map(p => p.id === profileId ? { ...p, role: newRole } : p));
      } else {
        const errData = await resp.json().catch(() => ({}));
        console.error('[changeUserRole] PATCH failed:', resp.status, errData);
        alert(`Role change failed: ${errData.message || resp.status}`);
      }
    } catch (e) {
      console.error('[changeUserRole] error:', e);
      alert('Role change failed: network error');
    } finally {

  useEffect(() => { paintRef.current        = paintCells;           }, [paintCells]);

  const commitMultipleCells = useCallback((cells) => {
    if (!cells.length) return;

    const isEraser = eraserRef.current;

    } else if (tileId === SPACE_REF) {
      histLabelRef.current = "Draw Space";
    } else if (tileId === WARN_REF) {

          ?? (paintTile.codename ?? '').split('_').slice(1).join('-')

  useEffect(() => { commitOnUpRef.current = commitSelectionOnMouseUp; }, [commitSelectionOnMouseUp]);

  // Convert screen (clientX, clientY) → grid [r, c], or null if outside the grid area

    const y = clientY - rect.top - CELL * z; // subtract 1-row top border offset

  // ── Export ────────────────────────────────────────────────────────
  const doExport = () => {
    const padding = CELL;
    const cv = document.createElement("canvas");
    cv.width  = gridW * CELL;
    cv.height = gridH * CELL + padding * 2;
    const ctx = cv.getContext("2d");
    for (let r = 0; r < gridH; r++) for (let c = 0; c < gridW; c++) {
      ctx.fillStyle = (r + c) % 2 === 0 ? bg1 : bg2;
      ctx.fillRect(c * CELL, r * CELL + padding, CELL, CELL);
    }
    const draws = [];
    const spaceCells = []; // cells that should be cleared to transparent
    grid.forEach((row, r) => row.forEach((id, c) => {
      const t = getCellTile(id);
      if (!t) return;
      if (t.isSpace) { spaceCells.push({ r, c }); return; }
      draws.push({ ref: t.ref, z: isPriorityTile(t) ? 2 : (isBottomTile(t) ? 0 : 1), src: t.blobSrc ?? t.src, r, c, mult: getTileMultiplier(t), off: getEffectiveOffset(t, r, c), rotDeg: (gridRotations[`${r},${c}`] ?? 0) * 90, flipStep: gridFlips[`${r},${c}`] ?? 0 });
    }));
    const filename = (mapName.trim() || "ophelia-map") + ".png";
    const finish = () => {
      // Clear space tile cells last so they are fully transparent in the output
      spaceCells.forEach(({ r, c }) => ctx.clearRect(c * CELL, r * CELL + padding, CELL, CELL));
      cv.toBlob(b => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(b); a.download = filename; a.click();
      });
    };
    if (!draws.length) { finish(); return; }
    // Sort: bottom tiles first, then normal, then priority tiles last → correct z-order in export
    draws.sort((a, b) => a.z - b.z);
    // Load all images then draw in sorted order (guarantees z-order)
    // Use cached ImageBitmap for user-uploaded tiles to avoid re-decoding
    Promise.all(draws.map(d => new Promise(resolve => {
      const bm = userBitmapCacheRef.current.get(d.ref);
      if (bm) { resolve({ ...d, img: bm }); return; }
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => resolve({ ...d, img });
      img.onerror = () => resolve(null);
      img.src = d.src;
    }))).then(loaded => {
      loaded.forEach(item => {
        if (!item) return;
        const { img, r, c, mult, off, rotDeg, flipStep } = item;
        const drawW = CELL * mult;
        const imgW = img.naturalWidth  ?? img.width;
        const imgH = img.naturalHeight ?? img.height;
        const drawH = drawW * (imgH / imgW);
        const cx = c * CELL + CELL / 2 + (off.ox / 100) * CELL;
        const cy = r * CELL + padding + CELL / 2 + (off.oy / 100) * CELL;
        ctx.save();
        ctx.translate(cx, cy);
        if (rotDeg) ctx.rotate(rotDeg * Math.PI / 180);
        if (flipStep) {
          const fx = (flipStep === 1 || flipStep === 2) ? -1 : 1;
          const fy = (flipStep === 2 || flipStep === 3) ? -1 : 1;
          ctx.scale(fx, fy);
        }
        ctx.drawImage(img, -drawW / 2, -drawH / 2, drawW, drawH);
        ctx.restore();
      });
      finish();
    });
  };
